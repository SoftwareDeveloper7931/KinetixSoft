<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A11" />
      <stop offset="50%" stop-color="#0E1422" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5FBD" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141B2B" />
      <stop offset="100%" stop-color="#0D1320" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid Pattern -->
  <g opacity="0.05">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Glows -->
  <circle cx="200" cy="180" r="260" fill="#4A5FBD" opacity="0.12" />
  <circle cx="1000" cy="420" r="300" fill="#06B6D4" opacity="0.1" />

  <!-- Header Badge & Titles -->
  <g transform="translate(80, 70)">
    <rect width="210" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="105" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">COMPREHENSIVE MASTERCLASS</text>
    
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">The Ultimate FlutterFlow Beginner Guide</text>
    <text x="0" y="100" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">From Visual Widgets &amp; API Integration to Enterprise Security &amp; App Store Launch</text>
  </g>

  <!-- 3 Major Pipeline Pillars -->
  <g transform="translate(80, 205)">
    <!-- Pillar 1: UI & Layouts -->
    <g transform="translate(0, 0)">
      <rect width="325" height="360" rx="14" fill="url(#cardGrad)" stroke="#232A36" stroke-width="1.5" />
      <rect x="25" y="25" width="40" height="40" rx="8" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.3" />
      <text x="45" y="50" fill="#7E95F7" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">01</text>
      
      <text x="25" y="95" fill="#E9EBEF" font-family="sans-serif" font-size="18" font-weight="700">UI &amp; Widget System</text>
      <text x="25" y="118" fill="#8A93A3" font-family="sans-serif" font-size="12">Visual Hierarchy &amp; Components</text>

      <g transform="translate(25, 140)">
        <rect width="275" height="40" rx="6" fill="#121724" stroke="#1F2633" />
        <text x="15" y="25" fill="#E9EBEF" font-family="monospace" font-size="11">Rows, Columns &amp; Stacks</text>
      </g>
      <g transform="translate(25, 190)">
        <rect width="275" height="40" rx="6" fill="#121724" stroke="#1F2633" />
        <text x="15" y="25" fill="#E9EBEF" font-family="monospace" font-size="11">ListViews &amp; Dynamic Grids</text>
      </g>
      <g transform="translate(25, 240)">
        <rect width="275" height="40" rx="6" fill="#121724" stroke="#1F2633" />
        <text x="15" y="25" fill="#E9EBEF" font-family="monospace" font-size="11">Form Inputs &amp; Validations</text>
      </g>
      <g transform="translate(25, 290)">
        <rect width="275" height="45" rx="6" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.3" />
        <text x="15" y="28" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="600">&#10003; Full Widget Hierarchy Covered</text>
      </g>
    </g>

    <!-- Pillar 2: State & REST APIs -->
    <g transform="translate(355, 0)">
      <rect width="325" height="360" rx="14" fill="url(#cardGrad)" stroke="#4A5FBD" stroke-width="2" />
      <rect x="25" y="25" width="40" height="40" rx="8" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-opacity="0.3" />
      <text x="45" y="50" fill="#06B6D4" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">02</text>
      
      <text x="25" y="95" fill="#E9EBEF" font-family="sans-serif" font-size="18" font-weight="700">Backend &amp; API Logic</text>
      <text x="25" y="118" fill="#8A93A3" font-family="sans-serif" font-size="12">State, Brevo &amp; OpenAI Integration</text>

      <g transform="translate(25, 140)">
        <rect width="275" height="40" rx="6" fill="#121724" stroke="#1F2633" />
        <text x="15" y="25" fill="#E9EBEF" font-family="monospace" font-size="11">App State vs Page State</text>
      </g>
      <g transform="translate(25, 190)">
        <rect width="275" height="40" rx="6" fill="#121724" stroke="#1F2633" />
        <text x="15" y="25" fill="#E9EBEF" font-family="monospace" font-size="11">Brevo API: Private Cloud Functions</text>
      </g>
      <g transform="translate(25, 240)">
        <rect width="275" height="40" rx="6" fill="#121724" stroke="#1F2633" />
        <text x="15" y="25" fill="#E9EBEF" font-family="monospace" font-size="11">OpenAI Conversational Chatbot</text>
      </g>
      <g transform="translate(25, 290)">
        <rect width="275" height="45" rx="6" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.3" />
        <text x="15" y="28" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="600">&#10003; Zero Secret Leaks to Client</text>
      </g>
    </g>

    <!-- Pillar 3: Security & Store Publishing -->
    <g transform="translate(710, 0)">
      <rect width="325" height="360" rx="14" fill="url(#cardGrad)" stroke="#232A36" stroke-width="1.5" />
      <rect x="25" y="25" width="40" height="40" rx="8" fill="#F43F5E" fill-opacity="0.15" stroke="#F43F5E" stroke-opacity="0.3" />
      <text x="45" y="50" fill="#F43F5E" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">03</text>
      
      <text x="25" y="95" fill="#E9EBEF" font-family="sans-serif" font-size="18" font-weight="700">Security &amp; Store Launch</text>
      <text x="25" y="118" fill="#8A93A3" font-family="sans-serif" font-size="12">RBAC Claims &amp; Store Checklists</text>

      <g transform="translate(25, 140)">
        <rect width="275" height="40" rx="6" fill="#121724" stroke="#1F2633" />
        <text x="15" y="25" fill="#E9EBEF" font-family="monospace" font-size="11">Firebase Custom Claims RBAC</text>
      </g>
      <g transform="translate(25, 190)">
        <rect width="275" height="40" rx="6" fill="#121724" stroke="#1F2633" />
        <text x="15" y="25" fill="#E9EBEF" font-family="monospace" font-size="11">Apple App Store (iOS 16+ ATS)</text>
      </g>
      <g transform="translate(25, 240)">
        <rect width="275" height="40" rx="6" fill="#121724" stroke="#1F2633" />
        <text x="15" y="25" fill="#E9EBEF" font-family="monospace" font-size="11">Google Play (AAB, SDK 34+)</text>
      </g>
      <g transform="translate(25, 290)">
        <rect width="275" height="45" rx="6" fill="#10B981" fill-opacity="0.08" stroke="#10B981" stroke-opacity="0.3" />
        <text x="15" y="28" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="600">&#10003; 100% Rejection Prevention</text>
      </g>
    </g>
  </g>

  <!-- Footer Branding -->
  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft Engineering Blueprint</text>
    <text x="240" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">&#8226; FlutterFlow 2026 Production Edition</text>
  </g>
</svg>