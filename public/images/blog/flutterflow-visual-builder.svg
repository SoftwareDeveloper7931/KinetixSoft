<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5FBD" />
      <stop offset="100%" stop-color="#364790" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Header Section -->
  <g transform="translate(80, 70)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="65" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">NO-CODE ENGINEERING</text>

    <!-- Title -->
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">FlutterFlow Visual Development Canvas</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Drag-and-Drop Widget Tree Compiling Directly to Native Flutter/Dart Code</text>
  </g>

  <!-- Dynamic Content Area -->
  <g transform="translate(80, 200)">
    
  <g transform="translate(0, 20)">
    <!-- Canvas Window -->
    <rect width="700" height="340" rx="10" fill="#101520" stroke="#232A36" stroke-width="1.5" />
    <!-- Window topbar -->
    <rect width="700" height="36" rx="10" fill="#161E2C" />
    <circle cx="25" cy="18" r="4" fill="#EF4444" />
    <circle cx="40" cy="18" r="4" fill="#F59E0B" />
    <circle cx="55" cy="18" r="4" fill="#10B981" />
    <text x="350" y="23" fill="#8A93A3" font-family="sans-serif" font-size="11" text-anchor="middle">FlutterFlow Builder • main.dart [Generated]</text>

    <!-- Sidebar Widget Tree -->
    <rect x="0" y="36" width="180" height="304" fill="#0D131C" />
    <text x="20" y="65" fill="#7E95F7" font-family="sans-serif" font-size="11" font-weight="700">WIDGET TREE</text>
    <text x="20" y="90" fill="#E9EBEF" font-family="monospace" font-size="10">▼ Scaffold</text>
    <text x="35" y="110" fill="#E9EBEF" font-family="monospace" font-size="10">▼ SafeArea</text>
    <text x="50" y="130" fill="#E9EBEF" font-family="monospace" font-size="10">▼ Column</text>
    <text x="65" y="150" fill="#E9EBEF" font-family="monospace" font-size="10">• HeaderText</text>
    <text x="65" y="170" fill="#E9EBEF" font-family="monospace" font-size="10">• ListView</text>
    <text x="65" y="190" fill="#3B82F6" font-family="monospace" font-size="10">• ActionButton</text>

    <!-- Center Phone Screen -->
    <rect x="260" y="55" width="180" height="265" rx="12" fill="#161F2E" stroke="#4A5FBD" stroke-width="2" />
    <rect x="275" y="75" width="150" height="25" rx="4" fill="#222C3D" />
    <rect x="275" y="110" width="150" height="70" rx="4" fill="#222C3D" />
    <rect x="275" y="190" width="150" height="35" rx="4" fill="#4A5FBD" />
    <text x="350" y="212" fill="#FFF" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Trigger Backend Action</text>

    <!-- Code Output Inspector -->
    <rect x="520" y="36" width="180" height="304" fill="#0D131C" />
    <text x="535" y="65" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700">DART CODE EXPORT</text>
    <text x="535" y="90" fill="#F43F5E" font-family="monospace" font-size="9">class AppScreen</text>
    <text x="535" y="105" fill="#8A93A3" font-family="monospace" font-size="9">extends StatelessWidget {</text>
    <text x="545" y="125" fill="#8A93A3" font-family="monospace" font-size="9">@override</text>
    <text x="545" y="140" fill="#38BDF8" font-family="monospace" font-size="9">Widget build(...) {</text>
    <text x="555" y="160" fill="#10B981" font-family="monospace" font-size="9">return Scaffold(...);</text>
    <text x="545" y="180" fill="#8A93A3" font-family="monospace" font-size="9">}</text>
    <text x="535" y="195" fill="#8A93A3" font-family="monospace" font-size="9">}</text>

    <!-- Right Side Benefits -->
    <g transform="translate(740, 20)">
      <rect width="300" height="90" rx="8" fill="#131926" stroke="#232A36" />
      <text x="20" y="35" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">100% Code Ownership</text>
      <text x="20" y="60" fill="#8A93A3" font-family="sans-serif" font-size="11">Export standard clean Flutter / Dart code anytime and continue in VS Code or Android Studio.</text>

      <rect y="110" width="300" height="90" rx="8" fill="#131926" stroke="#232A36" />
      <text x="20" y="145" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">Native Compilation</text>
      <text x="20" y="170" fill="#8A93A3" font-family="sans-serif" font-size="11">Compiles directly to native iOS and Android binaries — 60 FPS performance without web wrappers.</text>

      <rect y="220" width="300" height="90" rx="8" fill="#131926" stroke="#232A36" />
      <text x="20" y="255" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">4x Faster Time-to-Market</text>
      <text x="20" y="280" fill="#8A93A3" font-family="sans-serif" font-size="11">Ship production-grade MVPs in 4 to 8 weeks at a fraction of traditional agency rates.</text>
    </g>
  </g>
  
  </g>

  <!-- Watermark / Footer branding -->
  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Technical Architecture Series</text>
  </g>
</svg>