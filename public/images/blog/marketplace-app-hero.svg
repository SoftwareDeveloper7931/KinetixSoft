<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5FBD" />
      <stop offset="100%" stop-color="#364790" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Header Section -->
  <g transform="translate(80, 70)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="65" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">CIRCULAR ECONOMY</text>

    <!-- Title -->
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Second-Hand P2P Marketplace</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Rapid Listing, Client WebP Compression, In-App Chat &amp; Escrow Payouts</text>
  </g>

  <!-- Dynamic Content Area -->
  <g transform="translate(80, 200)">
    
  <g transform="translate(0, 20)">
    <!-- Listing Card Mockup -->
    <g transform="translate(40, 0)">
      <rect width="280" height="340" rx="12" fill="url(#cardGrad)" stroke="#232A36" stroke-width="1.5" />
      <rect x="20" y="20" width="240" height="150" rx="8" fill="#1C2433" />
      <text x="140" y="100" fill="#4A5FBD" font-family="sans-serif" font-size="32" text-anchor="middle">📷</text>
      <rect x="30" y="30" width="80" height="22" rx="4" fill="#10B981" />
      <text x="70" y="45" fill="#FFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">LIKE NEW</text>

      <text x="25" y="195" fill="#E9EBEF" font-family="sans-serif" font-size="15" font-weight="700">Vintage 35mm Film Camera</text>
      <text x="25" y="220" fill="#10B981" font-family="sans-serif" font-size="16" font-weight="700">$185.00</text>
      <text x="25" y="240" fill="#8A93A3" font-family="sans-serif" font-size="11">📍 4.2 miles away • Posted 2h ago</text>

      <rect x="25" y="265" width="110" height="40" rx="6" fill="#1C2433" />
      <text x="80" y="290" fill="#E9EBEF" font-family="sans-serif" font-size="12" text-anchor="middle">Make Offer</text>

      <rect x="145" y="265" width="110" height="40" rx="6" fill="#4A5FBD" />
      <text x="200" y="290" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Chat Now</text>
    </g>

    <!-- Chat &amp; Escrow Flow -->
    <g transform="translate(360, 0)">
      <rect width="320" height="340" rx="12" fill="url(#cardGrad)" stroke="#232A36" stroke-width="1.5" />
      <rect x="20" y="20" width="280" height="40" rx="6" fill="#192231" />
      <text x="35" y="45" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600">Buyer &amp; Seller In-App Chat</text>

      <!-- Messages -->
      <rect x="20" y="75" width="200" height="35" rx="6" fill="#202A3C" />
      <text x="30" y="97" fill="#E9EBEF" font-family="sans-serif" font-size="11">Would you take $165 for it?</text>

      <rect x="100" y="120" width="200" height="35" rx="6" fill="#4A5FBD" />
      <text x="110" y="142" fill="#FFFFFF" font-family="sans-serif" font-size="11">Yes, I can ship it today!</text>

      <!-- Escrow status card -->
      <rect x="20" y="175" width="280" height="130" rx="8" fill="#121824" stroke="#10B981" stroke-width="1.5" />
      <text x="35" y="205" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">ESCROW FUNDS SECURED ($165)</text>
      <text x="35" y="230" fill="#8A93A3" font-family="sans-serif" font-size="11">Tracking: USPS #94001118992200</text>
      <text x="35" y="250" fill="#8A93A3" font-family="sans-serif" font-size="11">Status: In Transit • Arriving Thursday</text>
      <text x="35" y="280" fill="#E9EBEF" font-family="sans-serif" font-size="10">Funds released to seller upon buyer inspection</text>
    </g>

    <!-- Architecture Pillars -->
    <g transform="translate(720, 20)">
      <rect width="320" height="90" rx="8" fill="#131926" stroke="#232A36" />
      <text x="25" y="35" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">Client-Side WebP Compression</text>
      <text x="25" y="60" fill="#8A93A3" font-family="sans-serif" font-size="11">12MB camera photos compressed to &lt;350KB before upload, cutting storage costs by 80%.</text>

      <rect y="110" width="320" height="90" rx="8" fill="#131926" stroke="#232A36" />
      <text x="25" y="145" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">Radius Search with Algolia</text>
      <text x="25" y="170" fill="#8A93A3" font-family="sans-serif" font-size="11">Sub-50ms geo-search lets buyers browse items within 5, 15, or 50 miles of their location.</text>

      <rect y="220" width="320" height="90" rx="8" fill="#131926" stroke="#232A36" />
      <text x="25" y="255" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">AI Vision Content Moderation</text>
      <text x="25" y="280" fill="#8A93A3" font-family="sans-serif" font-size="11">Cloud Vision API screens photos in real-time to prevent inappropriate or counterfeit items.</text>
    </g>
  </g>
  
  </g>

  <!-- Watermark / Footer branding -->
  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Technical Architecture Series</text>
  </g>
</svg>