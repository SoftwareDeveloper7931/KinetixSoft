<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="80" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">E-COMMERCE DATABASE ERD</text>
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Mobile E-Commerce Schema (ER Diagram)</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Entity Relationships for Product Catalog, Cart State, Orders &amp; Shopify Sync</text>
  </g>

  <g transform="translate(80, 195)">
    
  <g transform="translate(0, 10)">
    <g transform="translate(20, 0)">
      <rect width="220" height="175" rx="8" fill="#131926" stroke="#4A5FBD" stroke-width="1.5" />
      <rect width="220" height="32" rx="8" fill="#1D263B" />
      <text x="15" y="21" fill="#7E95F7" font-family="monospace" font-size="13" font-weight="700">products</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#8A93A3" font-family="monospace" font-size="11">   shopify_id: text</text>
      <text x="15" y="96" fill="#8A93A3" font-family="monospace" font-size="11">   title: string</text>
      <text x="15" y="118" fill="#10B981" font-family="monospace" font-size="11">   price: numeric</text>
      <text x="15" y="140" fill="#8A93A3" font-family="monospace" font-size="11">   inventory_count: int</text>
      <text x="15" y="162" fill="#8A93A3" font-family="monospace" font-size="11">   images: text[]</text>
    </g>

    <g transform="translate(20, 205)">
      <rect width="220" height="150" rx="8" fill="#131926" stroke="#232A36" stroke-width="1.5" />
      <rect width="220" height="32" rx="8" fill="#1A2233" />
      <text x="15" y="21" fill="#E9EBEF" font-family="monospace" font-size="13" font-weight="700">cart_items</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#7E95F7" font-family="monospace" font-size="11">🔗 user_id: uuid [FK]</text>
      <text x="15" y="96" fill="#7E95F7" font-family="monospace" font-size="11">🔗 product_id: uuid [FK]</text>
      <text x="15" y="118" fill="#8A93A3" font-family="monospace" font-size="11">   qty: int, size: text</text>
      <text x="15" y="140" fill="#8A93A3" font-family="monospace" font-size="11">   created_at: timestamp</text>
    </g>

    <g transform="translate(380, 0)">
      <rect width="270" height="215" rx="8" fill="#131926" stroke="#4A5FBD" stroke-width="2" />
      <rect width="270" height="32" rx="8" fill="#1D263B" />
      <text x="15" y="21" fill="#7E95F7" font-family="monospace" font-size="13" font-weight="700">orders [CORE STATE]</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#7E95F7" font-family="monospace" font-size="11">🔗 user_id: uuid [FK]</text>
      <text x="15" y="96" fill="#10B981" font-family="monospace" font-size="11">   total_amount: numeric</text>
      <text x="15" y="118" fill="#8A93A3" font-family="monospace" font-size="11">   payment_status: 'PAID'</text>
      <text x="15" y="140" fill="#8A93A3" font-family="monospace" font-size="11">   fulfillment_status: text</text>
      <text x="15" y="162" fill="#8A93A3" font-family="monospace" font-size="11">   shipping_address: jsonb</text>
      <text x="15" y="184" fill="#8A93A3" font-family="monospace" font-size="11">   tracking_url: text</text>
    </g>

    <g transform="translate(380, 235)">
      <rect width="270" height="135" rx="8" fill="#131926" stroke="#232A36" stroke-width="1.5" />
      <rect width="270" height="32" rx="8" fill="#1A2233" />
      <text x="15" y="21" fill="#E9EBEF" font-family="monospace" font-size="13" font-weight="700">order_line_items</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#7E95F7" font-family="monospace" font-size="11">🔗 order_id: uuid [FK]</text>
      <text x="15" y="96" fill="#7E95F7" font-family="monospace" font-size="11">🔗 product_id: uuid [FK]</text>
      <text x="15" y="118" fill="#8A93A3" font-family="monospace" font-size="11">   unit_price: numeric, qty: int</text>
    </g>

    <g transform="translate(770, 0)">
      <rect width="250" height="185" rx="8" fill="#101522" stroke="#10B981" stroke-width="1.5" />
      <text x="15" y="28" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">ATOMIC TRANSACTIONS</text>
      <text x="15" y="55" fill="#E9EBEF" font-family="sans-serif" font-size="11">• products (1) ── (N) order_items</text>
      <text x="15" y="78" fill="#E9EBEF" font-family="sans-serif" font-size="11">• orders (1) ── (N) order_items</text>
      <text x="15" y="101" fill="#E9EBEF" font-family="sans-serif" font-size="11">• users (1) ── (N) orders</text>
      <line x1="15" y1="115" x2="235" y2="115" stroke="#232A36" />
      <text x="15" y="135" fill="#10B981" font-family="sans-serif" font-size="10">Cloud Function Checkout:</text>
      <text x="15" y="152" fill="#8A93A3" font-family="sans-serif" font-size="10">Atomic inventory decrement prevents overselling on flash drops.</text>
    </g>

    <path d="M240,75 H380" stroke="#7E95F7" stroke-width="2" stroke-dasharray="4" />
  </g>
  
  </g>

  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Database ER Architecture Series</text>
  </g>
</svg>