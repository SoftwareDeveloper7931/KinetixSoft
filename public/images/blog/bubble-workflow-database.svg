<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5FBD" />
      <stop offset="100%" stop-color="#364790" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Header Section -->
  <g transform="translate(80, 70)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="65" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">SAAS PLATFORM</text>

    <!-- Title -->
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Bubble.io Full-Stack Web Architecture</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Visual Relational Database, Server-Side Workflows, & Privacy Rules</text>
  </g>

  <!-- Dynamic Content Area -->
  <g transform="translate(80, 200)">
    
  <g transform="translate(0, 20)">
    <!-- 3 Tier Architecture -->
    <g transform="translate(40, 0)">
      <rect width="280" height="340" rx="10" fill="#131926" stroke="#232A36" />
      <text x="25" y="35" fill="#3B82F6" font-family="sans-serif" font-size="12" font-weight="700">1. VISUAL DATABASE</text>
      <text x="25" y="60" fill="#E9EBEF" font-family="sans-serif" font-size="14" font-weight="600">Relational Data Types</text>
      
      <rect x="25" y="80" width="230" height="32" rx="4" fill="#1C2433" />
      <text x="35" y="101" fill="#E9EBEF" font-family="monospace" font-size="11">User [email, role, org_id]</text>

      <rect x="25" y="120" width="230" height="32" rx="4" fill="#1C2433" />
      <text x="35" y="141" fill="#E9EBEF" font-family="monospace" font-size="11">Organization [tier, seats]</text>

      <rect x="25" y="160" width="230" height="32" rx="4" fill="#1C2433" />
      <text x="35" y="181" fill="#E9EBEF" font-family="monospace" font-size="11">Invoice [amount, paid_date]</text>

      <rect x="25" y="210" width="230" height="95" rx="6" fill="#10B981" fill-opacity="0.1" stroke="#10B981" />
      <text x="35" y="235" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">PRIVACY RULES</text>
      <text x="35" y="255" fill="#8A93A3" font-family="sans-serif" font-size="11">• Current User's Org == This Org</text>
      <text x="35" y="275" fill="#8A93A3" font-family="sans-serif" font-size="11">• Role is 'Admin' can edit records</text>
      <text x="35" y="295" fill="#8A93A3" font-family="sans-serif" font-size="11">• Strict server-side access enforcement</text>
    </g>

    <g transform="translate(360, 0)">
      <rect width="280" height="340" rx="10" fill="#131926" stroke="#232A36" />
      <text x="25" y="35" fill="#F59E0B" font-family="sans-serif" font-size="12" font-weight="700">2. WORKFLOW LOGIC</text>
      <text x="25" y="60" fill="#E9EBEF" font-family="sans-serif" font-size="14" font-weight="600">Conditional Triggers</text>

      <rect x="25" y="80" width="230" height="55" rx="6" fill="#1F2839" />
      <text x="35" y="103" fill="#E9EBEF" font-family="sans-serif" font-size="11" font-weight="600">When User Clicks 'Subscribe'</text>
      <text x="35" y="122" fill="#8A93A3" font-family="sans-serif" font-size="10">→ Trigger Stripe Checkout Session</text>

      <rect x="25" y="145" width="230" height="55" rx="6" fill="#1F2839" />
      <text x="35" y="168" fill="#E9EBEF" font-family="sans-serif" font-size="11" font-weight="600">Backend API Webhook Event</text>
      <text x="35" y="187" fill="#8A93A3" font-family="sans-serif" font-size="10">→ Update Subscription Status to Active</text>

      <rect x="25" y="210" width="230" height="55" rx="6" fill="#1F2839" />
      <text x="35" y="233" fill="#E9EBEF" font-family="sans-serif" font-size="11" font-weight="600">Scheduled Nightly Job</text>
      <text x="35" y="252" fill="#8A93A3" font-family="sans-serif" font-size="10">→ Calculate monthly recurring usage</text>
    </g>

    <g transform="translate(680, 0)">
      <rect width="320" height="340" rx="10" fill="#131926" stroke="#232A36" />
      <text x="25" y="35" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">3. FULL-STACK POWER</text>
      <text x="25" y="60" fill="#E9EBEF" font-family="sans-serif" font-size="14" font-weight="600">Why Founders Choose Bubble</text>

      <g transform="translate(25, 90)">
        <circle cx="8" cy="8" r="4" fill="#4A5FBD" />
        <text x="25" y="12" fill="#E9EBEF" font-family="sans-serif" font-size="12" font-weight="600">Built-In Database & Auth</text>
        <text x="25" y="32" fill="#8A93A3" font-family="sans-serif" font-size="11">No separate Supabase or backend needed — entire app lives under one unified roof.</text>
      </g>

      <g transform="translate(25, 170)">
        <circle cx="8" cy="8" r="4" fill="#4A5FBD" />
        <text x="25" y="12" fill="#E9EBEF" font-family="sans-serif" font-size="12" font-weight="600">API Connector</text>
        <text x="25" y="32" fill="#8A93A3" font-family="sans-serif" font-size="11">Connect to any external REST or GraphQL endpoint, SendGrid, Stripe, OpenAI, and CRMs.</text>
      </g>

      <g transform="translate(25, 250)">
        <circle cx="8" cy="8" r="4" fill="#4A5FBD" />
        <text x="25" y="12" fill="#E9EBEF" font-family="sans-serif" font-size="12" font-weight="600">Scalable to Millions in ARR</text>
        <text x="25" y="32" fill="#8A93A3" font-family="sans-serif" font-size="11">Hundreds of SaaS companies operate multi-million dollar annual revenue businesses on Bubble.</text>
      </g>
    </g>
  </g>
  
  </g>

  <!-- Watermark / Footer branding -->
  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Technical Architecture Series</text>
  </g>
</svg>