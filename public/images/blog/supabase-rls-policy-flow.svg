<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="80" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">QUERY EXECUTION FLOW</text>
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Supabase PostgREST &amp; PostgreSQL RLS Execution Engine</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">How Client Requests are Transformed, Filtered &amp; Executed by Postgres Kernel</text>
  </g>

  <g transform="translate(80, 195)">
    
  <g transform="translate(0, 20)">
    <g transform="translate(30, 0)">
      <rect width="210" height="320" rx="8" fill="#131926" stroke="#232A36" />
      <text x="20" y="35" fill="#3B82F6" font-family="sans-serif" font-size="12" font-weight="700">1. FLUTTERFLOW CLIENT</text>
      <text x="20" y="65" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600">Client REST Query</text>
      <text x="20" y="95" fill="#8A93A3" font-family="sans-serif" font-size="11">App sends HTTP request to Supabase API with JWT auth bearer header containing user UID.</text>
      <rect x="20" y="160" width="170" height="70" rx="4" fill="#192233" />
      <text x="30" y="185" fill="#7E95F7" font-family="monospace" font-size="11">GET /rest/v1/orders</text>
      <text x="30" y="205" fill="#8A93A3" font-family="monospace" font-size="10">Bearer: eyJhbGciOi...</text>
    </g>

    <g transform="translate(270, 0)">
      <rect width="210" height="320" rx="8" fill="#131926" stroke="#4A5FBD" stroke-width="2" />
      <text x="20" y="35" fill="#7E95F7" font-family="sans-serif" font-size="12" font-weight="700">2. POSTGREST GATEWAY</text>
      <text x="20" y="65" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600">Session Context</text>
      <text x="20" y="95" fill="#8A93A3" font-family="sans-serif" font-size="11">Sets Postgres session variables for current transaction before query execution begins.</text>
      <rect x="20" y="160" width="170" height="70" rx="4" fill="#192233" />
      <text x="30" y="185" fill="#10B981" font-family="monospace" font-size="10">set_config(</text>
      <text x="30" y="200" fill="#10B981" font-family="monospace" font-size="10">  'request.jwt.claim.sub'</text>
      <text x="30" y="215" fill="#10B981" font-family="monospace" font-size="10">  = auth.uid())</text>
    </g>

    <g transform="translate(510, 0)">
      <rect width="210" height="320" rx="8" fill="#131926" stroke="#10B981" stroke-width="2" />
      <text x="20" y="35" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">3. RLS FILTER REWRITE</text>
      <text x="20" y="65" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600">Kernel Query Rewrite</text>
      <text x="20" y="95" fill="#8A93A3" font-family="sans-serif" font-size="11">PostgreSQL query planner injects RLS predicates directly into the physical query tree.</text>
      <rect x="20" y="160" width="170" height="70" rx="4" fill="#192233" />
      <text x="30" y="185" fill="#E9EBEF" font-family="monospace" font-size="10">SELECT * FROM orders</text>
      <text x="30" y="200" fill="#10B981" font-family="monospace" font-size="10">WHERE user_id =</text>
      <text x="30" y="215" fill="#10B981" font-family="monospace" font-size="10">  current_user_uid</text>
    </g>

    <g transform="translate(750, 0)">
      <rect width="250" height="320" rx="8" fill="#131926" stroke="#232A36" />
      <text x="20" y="35" fill="#F59E0B" font-family="sans-serif" font-size="12" font-weight="700">4. SECURE JSON RESPONSE</text>
      <text x="20" y="65" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600">Zero Leakage Delivery</text>
      <text x="20" y="95" fill="#8A93A3" font-family="sans-serif" font-size="11">Only authorized records leave the Postgres database wire and return to the FlutterFlow state engine.</text>
      <rect x="20" y="160" width="210" height="70" rx="4" fill="#10B981" fill-opacity="0.1" stroke="#10B981" />
      <text x="30" y="195" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="700">✓ Strict Row Isolation</text>
      <text x="30" y="215" fill="#8A93A3" font-family="sans-serif" font-size="11">Zero manual backend code needed</text>
    </g>
  </g>
  
  </g>

  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Database ER Architecture Series</text>
  </g>
</svg>