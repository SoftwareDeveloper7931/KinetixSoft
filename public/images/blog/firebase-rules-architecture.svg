<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="80" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">EVALUATION PIPELINE</text>
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Firebase Security Rules Lifecycle &amp; Evaluation Pipeline</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Atomic Denial by Default, Subcollection Inheritance &amp; Custom Claims Access</text>
  </g>

  <g transform="translate(80, 195)">
    
  <g transform="translate(0, 20)">
    <g transform="translate(30, 0)">
      <rect width="210" height="320" rx="8" fill="#131926" stroke="#232A36" />
      <text x="20" y="35" fill="#EF4444" font-family="sans-serif" font-size="12" font-weight="700">PHASE 1 • DEFAULT DENY</text>
      <text x="20" y="65" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600">Zero Trust Baseline</text>
      <text x="20" y="95" fill="#8A93A3" font-family="sans-serif" font-size="11">Every document read or write is blocked by default unless an explicit matching rule returns true.</text>
      <rect x="20" y="160" width="170" height="70" rx="4" fill="#1A2233" />
      <text x="30" y="185" fill="#EF4444" font-family="monospace" font-size="11">service cloud.firestore {</text>
      <text x="30" y="205" fill="#EF4444" font-family="monospace" font-size="11">  // All routes locked</text>
      <text x="30" y="220" fill="#EF4444" font-family="monospace" font-size="11">}</text>
    </g>

    <g transform="translate(270, 0)">
      <rect width="210" height="320" rx="8" fill="#131926" stroke="#4A5FBD" stroke-width="2" />
      <text x="20" y="35" fill="#7E95F7" font-family="sans-serif" font-size="12" font-weight="700">PHASE 2 • IDENTITY CHECK</text>
      <text x="20" y="65" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600">Token Verification</text>
      <text x="20" y="95" fill="#8A93A3" font-family="sans-serif" font-size="11">Validates authentication state and extracts JWT claims (UID, email verified, custom admin claim).</text>
      <rect x="20" y="160" width="170" height="70" rx="4" fill="#1A2233" />
      <text x="30" y="185" fill="#7E95F7" font-family="monospace" font-size="11">request.auth != null</text>
      <text x="30" y="205" fill="#7E95F7" font-family="monospace" font-size="11">request.auth.token.admin</text>
    </g>

    <g transform="translate(510, 0)">
      <rect width="210" height="320" rx="8" fill="#131926" stroke="#232A36" />
      <text x="20" y="35" fill="#F59E0B" font-family="sans-serif" font-size="12" font-weight="700">PHASE 3 • DATA VALIDATION</text>
      <text x="20" y="65" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600">Schema Enforcement</text>
      <text x="20" y="95" fill="#8A93A3" font-family="sans-serif" font-size="11">Verifies required fields exist, data types match, and forbidden fields cannot be injected by malicious clients.</text>
      <rect x="20" y="160" width="170" height="70" rx="4" fill="#1A2233" />
      <text x="30" y="185" fill="#F59E0B" font-family="monospace" font-size="11">hasOnly(['title','price'])</text>
      <text x="30" y="205" fill="#F59E0B" font-family="monospace" font-size="11">price &gt; 0</text>
    </g>

    <g transform="translate(750, 0)">
      <rect width="250" height="320" rx="8" fill="#131926" stroke="#10B981" stroke-width="2" />
      <text x="20" y="35" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">PHASE 4 • ATOMIC PERMIT</text>
      <text x="20" y="65" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600">Commit to Firestore</text>
      <text x="20" y="95" fill="#8A93A3" font-family="sans-serif" font-size="11">If all predicates pass, the read/write commits and triggers real-time listeners across connected mobile clients.</text>
      <rect x="20" y="160" width="210" height="70" rx="4" fill="#10B981" fill-opacity="0.1" stroke="#10B981" />
      <text x="30" y="195" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="700">✓ 200 OK: Data Dispatched</text>
      <text x="30" y="215" fill="#8A93A3" font-family="sans-serif" font-size="11">Zero latency overhead</text>
    </g>
  </g>
  
  </g>

  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Database ER Architecture Series</text>
  </g>
</svg>