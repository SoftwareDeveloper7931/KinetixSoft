<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="70" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">TECHNOLOGY SELECTION</text>
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Modern Low-Code &amp; AI Platform Decision Matrix</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Choosing the Optimal Stack: Mobile Apps, Complex SaaS, Internal Dashboards &amp; AI MVPs</text>
  </g>

  <g transform="translate(80, 200)">
    
  <g transform="translate(0, 10)">
    <rect width="1040" height="350" rx="10" fill="#0E1420" stroke="#232A36" stroke-width="1.5" />
    
    <!-- Table Header -->
    <rect width="1040" height="45" rx="10" fill="#161E2E" />
    <text x="30" y="28" fill="#8A93A3" font-family="sans-serif" font-size="12" font-weight="700">PLATFORM</text>
    <text x="220" y="28" fill="#8A93A3" font-family="sans-serif" font-size="12" font-weight="700">PRIMARY BEST USE</text>
    <text x="500" y="28" fill="#8A93A3" font-family="sans-serif" font-size="12" font-weight="700">CORE ADVANTAGE</text>
    <text x="760" y="28" fill="#8A93A3" font-family="sans-serif" font-size="12" font-weight="700">TYPICAL TIMELINE</text>
    <text x="940" y="28" fill="#8A93A3" font-family="sans-serif" font-size="12" font-weight="700">CODE EXPORT</text>

    <!-- Row 1: FlutterFlow -->
    <g transform="translate(0, 45)">
      <line x1="0" y1="60" x2="1040" y2="60" stroke="#1D2535" />
      <text x="30" y="38" fill="#7E95F7" font-family="sans-serif" font-size="14" font-weight="700">FlutterFlow</text>
      <text x="220" y="38" fill="#E9EBEF" font-family="sans-serif" font-size="13">Native iOS &amp; Android Mobile Apps</text>
      <text x="500" y="38" fill="#8A93A3" font-family="sans-serif" font-size="12">60 FPS performance, offline cache, camera &amp; GPS</text>
      <text x="760" y="38" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="600">4 – 8 Weeks</text>
      <text x="940" y="38" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="600">100% (Dart)</text>
    </g>

    <!-- Row 2: Bubble -->
