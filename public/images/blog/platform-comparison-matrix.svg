      <line x1="0" y1="60" x2="1040" y2="60" stroke="#1D2535" />
      <text x="30" y="38" fill="#3B82F6" font-family="sans-serif" font-size="14" font-weight="700">Bubble.io</text>
      <text x="220" y="38" fill="#E9EBEF" font-family="sans-serif" font-size="13">Full-Stack Web SaaS &amp; Marketplaces</text>
      <text x="500" y="38" fill="#8A93A3" font-family="sans-serif" font-size="12">Built-in database, complex workflows, user privacy</text>
      <text x="760" y="38" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="600">3 – 6 Weeks</text>
      <text x="940" y="38" fill="#EF4444" font-family="sans-serif" font-size="12">Hosted Only</text>
    </g>

    <!-- Row 3: Retool -->
    <g transform="translate(0, 165)">
      <line x1="0" y1="60" x2="1040" y2="60" stroke="#1D2535" />
      <text x="30" y="38" fill="#A855F7" font-family="sans-serif" font-size="14" font-weight="700">Retool</text>
      <text x="220" y="38" fill="#E9EBEF" font-family="sans-serif" font-size="13">Internal Admin Consoles &amp; Ops Tools</text>
      <text x="500" y="38" fill="#8A93A3" font-family="sans-serif" font-size="12">Direct SQL / REST connection, granular RBAC &amp; audit</text>
      <text x="760" y="38" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="600">2 – 4 Weeks</text>
      <text x="940" y="38" fill="#8A93A3" font-family="sans-serif" font-size="12">JSON / Git</text>
    </g>

    <!-- Row 4: Lovable -->
    <g transform="translate(0, 225)">
      <line x1="0" y1="60" x2="1040" y2="60" stroke="#1D2535" />
      <text x="30" y="38" fill="#F43F5E" font-family="sans-serif" font-size="14" font-weight="700">Lovable AI</text>
      <text x="220" y="38" fill="#E9EBEF" font-family="sans-serif" font-size="13">AI-Accelerated Web Apps &amp; MVPs</text>
      <text x="500" y="38" fill="#8A93A3" font-family="sans-serif" font-size="12">Generates modern React + Supabase code from prompts</text>
      <text x="760" y="38" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="600">1 – 3 Weeks</text>
      <text x="940" y="38" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="600">100% (React)</text>
    </g>

    <!-- Row 5: Podio -->
    <g transform="translate(0, 285)">
      <text x="30" y="38" fill="#10B981" font-family="sans-serif" font-size="14" font-weight="700">Citrix Podio</text>
      <text x="220" y="38" fill="#E9EBEF" font-family="sans-serif" font-size="13">B2B CRM &amp; Operations Automation</text>
      <text x="500" y="38" fill="#8A93A3" font-family="sans-serif" font-size="12">GlobiFlow triggers, SMS integrations, deal pipelines</text>
      <text x="760" y="38" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="600">2 – 5 Weeks</text>
      <text x="940" y="38" fill="#8A93A3" font-family="sans-serif" font-size="12">API Sync</text>
    </g>
  </g>
  
  </g>

  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Engineering Blueprint Series</text>
  </g>
</svg>