<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5FBD" />
      <stop offset="100%" stop-color="#364790" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Header Section -->
  <g transform="translate(80, 70)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="65" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">RETAIL ARCHITECTURE</text>

    <!-- Title -->
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Native Mobile E-Commerce App</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">1-Tap Apple Pay Checkout, High-Speed Browsing &amp; Real-time Shopify Sync</text>
  </g>

  <!-- Dynamic Content Area -->
  <g transform="translate(80, 200)">
    
  <g transform="translate(0, 20)">
    <!-- Phone 1: Catalog -->
    <g transform="translate(60, 0)">
      <rect width="280" height="360" rx="14" fill="url(#cardGrad)" stroke="#232A36" stroke-width="1.5" />
      <text x="25" y="35" fill="#E9EBEF" font-family="sans-serif" font-size="14" font-weight="700">Explore Collection</text>
      <!-- Filter pills -->
      <rect x="25" y="50" width="60" height="24" rx="12" fill="#4A5FBD" />
      <text x="55" y="66" fill="#FFF" font-family="sans-serif" font-size="10" text-anchor="middle">All Shoes</text>
      <rect x="95" y="50" width="60" height="24" rx="12" fill="#1C2433" />
      <text x="125" y="66" fill="#8A93A3" font-family="sans-serif" font-size="10" text-anchor="middle">Running</text>
      <rect x="165" y="50" width="60" height="24" rx="12" fill="#1C2433" />
      <text x="195" y="66" fill="#8A93A3" font-family="sans-serif" font-size="10" text-anchor="middle">Casual</text>

      <!-- Products -->
      <rect x="25" y="90" width="110" height="110" rx="6" fill="#161D29" />
      <rect x="35" y="100" width="90" height="50" rx="4" fill="#232D3F" />
      <text x="35" y="170" fill="#E9EBEF" font-family="sans-serif" font-size="11" font-weight="600">AeroGlide V2</text>
      <text x="35" y="187" fill="#10B981" font-family="sans-serif" font-size="11">$145.00</text>

      <rect x="145" y="90" width="110" height="110" rx="6" fill="#161D29" />
      <rect x="155" y="100" width="90" height="50" rx="4" fill="#232D3F" />
      <text x="155" y="170" fill="#E9EBEF" font-family="sans-serif" font-size="11" font-weight="600">Volt Trainer</text>
      <text x="155" y="187" fill="#10B981" font-family="sans-serif" font-size="11">$120.00</text>

      <!-- Flash sale banner -->
      <rect x="25" y="215" width="230" height="60" rx="6" fill="#4A5FBD" fill-opacity="0.2" stroke="#4A5FBD" />
      <text x="40" y="240" fill="#7E95F7" font-family="sans-serif" font-size="12" font-weight="700">PUSH ALERT FLASH SALE</text>
      <text x="40" y="258" fill="#E9EBEF" font-family="sans-serif" font-size="11">Use code SHIPFREE for 20% off</text>
    </g>

    <!-- Phone 2: Product &amp; 1-Tap Checkout -->
    <g transform="translate(380, 0)">
      <rect width="280" height="360" rx="14" fill="url(#cardGrad)" stroke="#232A36" stroke-width="1.5" />
      <rect x="25" y="25" width="230" height="140" rx="8" fill="#161D29" />
      <text x="140" y="95" fill="#4A5FBD" font-family="sans-serif" font-size="24" text-anchor="middle">👟</text>
      <text x="25" y="190" fill="#E9EBEF" font-family="sans-serif" font-size="15" font-weight="700">AeroGlide Pro Runner</text>
      <text x="25" y="210" fill="#10B981" font-family="sans-serif" font-size="14" font-weight="600">$165.00</text>
      <text x="25" y="235" fill="#8A93A3" font-family="sans-serif" font-size="11">Select Size: US 9, 9.5, 10, 11 (In Stock)</text>

      <!-- Apple Pay Button -->
      <rect x="25" y="260" width="230" height="46" rx="8" fill="#000000" stroke="#FFFFFF" stroke-opacity="0.3" />
      <text x="140" y="288" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="600" text-anchor="middle">Buy with Pay</text>
      <text x="140" y="325" fill="#8A93A3" font-family="sans-serif" font-size="10" text-anchor="middle">Instant 1-Tap Biometric Checkout</text>
    </g>

    <!-- Backend Integrations Feature Cards -->
    <g transform="translate(700, 30)">
      <rect width="320" height="90" rx="8" fill="#131926" stroke="#232A36" />
      <text x="25" y="35" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">Shopify Storefront API</text>
      <text x="25" y="60" fill="#8A93A3" font-family="sans-serif" font-size="11">Live inventory sync, customer order history, and discount coupons synced in real-time.</text>

      <rect y="110" width="320" height="90" rx="8" fill="#131926" stroke="#232A36" />
      <text x="25" y="145" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">Stripe PaymentSheet</text>
      <text x="25" y="170" fill="#8A93A3" font-family="sans-serif" font-size="11">Embedded native card entry, 3D Secure, Apple Pay and Google Pay without web redirects.</text>

      <rect y="220" width="320" height="90" rx="8" fill="#131926" stroke="#232A36" />
      <text x="25" y="255" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">Push Notification Engine</text>
      <text x="25" y="280" fill="#8A93A3" font-family="sans-serif" font-size="11">Automated abandoned cart reminders, flash drops, and package delivery tracking.</text>
    </g>
  </g>
  
  </g>

  <!-- Watermark / Footer branding -->
  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Technical Architecture Series</text>
  </g>
</svg>