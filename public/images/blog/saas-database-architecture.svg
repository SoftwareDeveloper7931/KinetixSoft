<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="70" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">SAAS ENGINEERING</text>
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Multi-Tenant SaaS Data &amp; Privacy Architecture</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Role-Based Access Control, Tenant Isolation &amp; Stripe Webhook Lifecycle</text>
  </g>

  <g transform="translate(80, 200)">
    
  <g transform="translate(0, 20)">
    <g transform="translate(30, 0)">
      <rect width="300" height="340" rx="10" fill="#121724" stroke="#232A36" />
      <text x="25" y="35" fill="#3B82F6" font-family="sans-serif" font-size="13" font-weight="700">ORGANIZATION TENANCY</text>
      <rect x="20" y="60" width="260" height="60" rx="6" fill="#192233" />
      <text x="35" y="85" fill="#E9EBEF" font-family="monospace" font-size="11">organizations {</text>
      <text x="50" y="103" fill="#8A93A3" font-family="monospace" font-size="10">id, name, tier, seat_limit</text>
      <text x="35" y="115" fill="#E9EBEF" font-family="monospace" font-size="11">}</text>

      <rect x="20" y="130" width="260" height="60" rx="6" fill="#192233" />
      <text x="35" y="155" fill="#E9EBEF" font-family="monospace" font-size="11">org_members {</text>
      <text x="50" y="173" fill="#8A93A3" font-family="monospace" font-size="10">user_id, org_id, role</text>
      <text x="35" y="185" fill="#E9EBEF" font-family="monospace" font-size="11">}</text>

      <rect x="20" y="205" width="260" height="110" rx="6" fill="#10B981" fill-opacity="0.1" stroke="#10B981" />
      <text x="35" y="230" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">Strict Tenant Partitioning</text>
      <text x="35" y="252" fill="#8A93A3" font-family="sans-serif" font-size="11">Zero possibility of cross-tenant data leakage. Every SQL / NoSQL query enforces org_id matching.</text>
    </g>

    <g transform="translate(370, 0)">
      <rect width="300" height="340" rx="10" fill="#121724" stroke="#232A36" />
      <text x="25" y="35" fill="#F59E0B" font-family="sans-serif" font-size="13" font-weight="700">ROLE-BASED PRIVACY RULES</text>
      <g transform="translate(20, 60)">
        <rect width="260" height="75" rx="6" fill="#192233" />
        <text x="15" y="25" fill="#E9EBEF" font-family="sans-serif" font-size="12" font-weight="600">Admin Role</text>
        <text x="15" y="45" fill="#8A93A3" font-family="sans-serif" font-size="11">Full billing control, member invites, audit logs, and data exports.</text>
      </g>
      <g transform="translate(20, 145)">
        <rect width="260" height="75" rx="6" fill="#192233" />
        <text x="15" y="25" fill="#E9EBEF" font-family="sans-serif" font-size="12" font-weight="600">Member Role</text>
        <text x="15" y="45" fill="#8A93A3" font-family="sans-serif" font-size="11">Create, edit, and comment on projects inside their assigned team.</text>
      </g>
      <g transform="translate(20, 230)">
        <rect width="260" height="75" rx="6" fill="#192233" />
        <text x="15" y="25" fill="#E9EBEF" font-family="sans-serif" font-size="12" font-weight="600">Guest / Viewer Role</text>
        <text x="15" y="45" fill="#8A93A3" font-family="sans-serif" font-size="11">Read-only presentation mode without export or edit permissions.</text>
      </g>
    </g>

    <g transform="translate(710, 0)">
      <rect width="300" height="340" rx="10" fill="#121724" stroke="#232A36" />
      <text x="25" y="35" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="700">BILLING &amp; SUBSCRIPTIONS</text>
      <g transform="translate(20, 60)">
        <rect width="260" height="60" rx="6" fill="#192233" />
        <text x="15" y="25" fill="#7E95F7" font-family="sans-serif" font-size="11" font-weight="600">customer.subscription.created</text>
        <text x="15" y="45" fill="#8A93A3" font-family="sans-serif" font-size="10">Unlocks premium features and assigns seats.</text>
      </g>
      <g transform="translate(20, 130)">
        <rect width="260" height="60" rx="6" fill="#192233" />
        <text x="15" y="25" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="600">invoice.payment_succeeded</text>
        <text x="15" y="45" fill="#8A93A3" font-family="sans-serif" font-size="10">Issues automated PDF receipt &amp; updates active billing period.</text>
      </g>
      <g transform="translate(20, 200)">
        <rect width="260" height="60" rx="6" fill="#192233" />
        <text x="15" y="25" fill="#EF4444" font-family="sans-serif" font-size="11" font-weight="600">customer.subscription.deleted</text>
        <text x="15" y="45" fill="#8A93A3" font-family="sans-serif" font-size="10">Enters 7-day grace period before downgrade to free tier.</text>
      </g>
    </g>
  </g>
  
  </g>

  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Engineering Blueprint Series</text>
  </g>
</svg>