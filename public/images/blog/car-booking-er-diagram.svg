<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="80" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">MOBILITY DATABASE ERD</text>
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Car Booking & Chauffeur Mobility Schema (ER Diagram)</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Entity Relationships for Riders, Drivers, Vehicles, Trips & Payment Pre-Auth</text>
  </g>

  <g transform="translate(80, 195)">
    
  <g transform="translate(0, 10)">
    <!-- users -->
    <g transform="translate(20, 0)">
      <rect width="210" height="175" rx="8" fill="#131926" stroke="#4A5FBD" stroke-width="1.5" />
      <rect width="210" height="32" rx="8" fill="#1D263B" />
      <text x="15" y="21" fill="#7E95F7" font-family="monospace" font-size="13" font-weight="700">users</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#8A93A3" font-family="monospace" font-size="11">   phone: string</text>
      <text x="15" y="96" fill="#8A93A3" font-family="monospace" font-size="11">   role: 'rider'|'driver'</text>
      <text x="15" y="118" fill="#8A93A3" font-family="monospace" font-size="11">   rating_avg: float</text>
      <text x="15" y="140" fill="#8A93A3" font-family="monospace" font-size="11">   stripe_cust_id: text</text>
    </g>

    <!-- vehicles -->
    <g transform="translate(20, 205)">
      <rect width="210" height="165" rx="8" fill="#131926" stroke="#232A36" stroke-width="1.5" />
      <rect width="210" height="32" rx="8" fill="#1A2233" />
      <text x="15" y="21" fill="#10B981" font-family="monospace" font-size="13" font-weight="700">vehicles</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#7E95F7" font-family="monospace" font-size="11">🔗 driver_id: uuid [FK]</text>
      <text x="15" y="96" fill="#8A93A3" font-family="monospace" font-size="11">   tier: 'sedan'|'van'|'first'</text>
      <text x="15" y="118" fill="#8A93A3" font-family="monospace" font-size="11">   license_plate: text</text>
      <text x="15" y="140" fill="#8A93A3" font-family="monospace" font-size="11">   is_active: boolean</text>
    </g>

    <!-- trips -->
    <g transform="translate(370, 0)">
      <rect width="280" height="230" rx="8" fill="#131926" stroke="#4A5FBD" stroke-width="2" />
      <rect width="280" height="32" rx="8" fill="#1D263B" />
      <text x="15" y="21" fill="#7E95F7" font-family="monospace" font-size="13" font-weight="700">trips [CORE FACT]</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#7E95F7" font-family="monospace" font-size="11">🔗 rider_id: uuid [FK]</text>
      <text x="15" y="96" fill="#7E95F7" font-family="monospace" font-size="11">🔗 driver_id: uuid [FK]</text>
      <text x="15" y="118" fill="#8A93A3" font-family="monospace" font-size="11">   pickup_geo: geography</text>
      <text x="15" y="140" fill="#8A93A3" font-family="monospace" font-size="11">   dropoff_geo: geography</text>
      <text x="15" y="162" fill="#10B981" font-family="monospace" font-size="11">   status: 'MATCHING'|'ENROUTE'</text>
      <text x="15" y="184" fill="#8A93A3" font-family="monospace" font-size="11">   estimated_fare: numeric</text>
      <text x="15" y="206" fill="#8A93A3" font-family="monospace" font-size="11">   created_at: timestamp</text>
    </g>

    <!-- payments -->
    <g transform="translate(780, 0)">
      <rect width="240" height="175" rx="8" fill="#131926" stroke="#232A36" stroke-width="1.5" />
      <rect width="240" height="32" rx="8" fill="#1A2233" />
      <text x="15" y="21" fill="#F59E0B" font-family="monospace" font-size="13" font-weight="700">trip_payments</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#7E95F7" font-family="monospace" font-size="11">🔗 trip_id: uuid [FK]</text>
      <text x="15" y="96" fill="#8A93A3" font-family="monospace" font-size="11">   stripe_pi: string</text>
      <text x="15" y="118" fill="#8A93A3" font-family="monospace" font-size="11">   hold_amount: numeric</text>
      <text x="15" y="140" fill="#10B981" font-family="monospace" font-size="11">   captured_amount: numeric</text>
      <text x="15" y="162" fill="#8A93A3" font-family="monospace" font-size="11">   payout_driver_net: numeric</text>
    </g>

    <!-- driver_locations (Real-time telemetry) -->
    <g transform="translate(370, 250)">
      <rect width="280" height="120" rx="8" fill="#131926" stroke="#10B981" stroke-width="1.5" />
      <rect width="280" height="32" rx="8" fill="#1A2233" />
      <text x="15" y="21" fill="#10B981" font-family="monospace" font-size="13" font-weight="700">driver_live_telemetry</text>
      <text x="15" y="52" fill="#7E95F7" font-family="monospace" font-size="11">🔗 driver_id: uuid [PK, FK]</text>
      <text x="15" y="74" fill="#8A93A3" font-family="monospace" font-size="11">   lat: float, lng: float</text>
      <text x="15" y="96" fill="#8A93A3" font-family="monospace" font-size="11">   bearing: float, updated_at</text>
    </g>

    <!-- Connectors -->
    <path d="M230,75 H370" stroke="#7E95F7" stroke-width="2" stroke-dasharray="4" />
    <path d="M650,75 H780" stroke="#7E95F7" stroke-width="2" stroke-dasharray="4" />
    <path d="M230,270 H370" stroke="#10B981" stroke-width="2" stroke-dasharray="4" />
  </g>
  
  </g>

  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Database ER Architecture Series</text>
  </g>
</svg>