<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550">
  <defs>
    <linearGradient id="ocBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E17" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="1000" height="550" rx="16" fill="url(#ocBg)" stroke="#1F2937" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(50, 40)">
    <rect width="210" height="26" rx="13" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-opacity="0.4" />
    <text x="105" y="17" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">OFFLINE-FIRST ARCHITECTURE</text>
    <text x="0" y="58" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="24" font-weight="800">FlutterFlow Real-Time &amp; Offline Chat Pipeline</text>
    <text x="0" y="84" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Optimistic UI rendering, local SQLite/Hive queue, auto-reconnect sync, and presence states.</text>
  </g>

  <!-- 3 Stages -->
  <g transform="translate(50, 140)">
    <!-- Stage 1: Client Offline Queue -->
    <g transform="translate(0, 0)">
      <rect width="280" height="340" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" />
      <circle cx="35" cy="35" r="16" fill="#3B82F6" fill-opacity="0.2" />
      <text x="35" y="40" fill="#60A5FA" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">1</text>
      <text x="65" y="40" fill="#F9FAFB" font-family="sans-serif" font-size="14" font-weight="700">Optimistic UI &amp; Local Queue</text>

      <text x="25" y="80" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">ZERO LATENCY RENDERING:</text>
      <text x="25" y="98" fill="#E2E8F0" font-family="sans-serif" font-size="11">Message appears immediately in</text>
      <text x="25" y="114" fill="#E2E8F0" font-family="sans-serif" font-size="11">chat bubble with single checkmark</text>
      <text x="25" y="130" fill="#E2E8F0" font-family="sans-serif" font-size="11">(status = 'pending_sync').</text>

      <rect x="20" y="150" width="240" height="150" rx="8" fill="#1F2937" />
      <text x="32" y="172" fill="#38BDF8" font-family="monospace" font-size="10.5">// Local SQLite / Hive Queue</text>
      <text x="32" y="192" fill="#E2E8F0" font-family="monospace" font-size="9.5">offlineMessageQueue.add({</text>
      <text x="32" y="210" fill="#E2E8F0" font-family="monospace" font-size="9.5">  id: tempUuid,</text>
      <text x="32" y="228" fill="#E2E8F0" font-family="monospace" font-size="9.5">  text: messageContent,</text>
      <text x="32" y="246" fill="#E2E8F0" font-family="monospace" font-size="9.5">  timestamp: DateTime.now(),</text>
      <text x="32" y="264" fill="#E2E8F0" font-family="monospace" font-size="9.5">  status: 'queued'</text>
      <text x="32" y="282" fill="#E2E8F0" font-family="monospace" font-size="9.5">});</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M295,170 H325" stroke="#60A5FA" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="325,165 335,170 325,175" fill="#60A5FA" />

    <!-- Stage 2: Connectivity Listener -->
    <g transform="translate(345, 0)">
      <rect width="280" height="340" rx="12" fill="#111827" stroke="#8B5CF6" stroke-width="1.5" />
      <circle cx="35" cy="35" r="16" fill="#8B5CF6" fill-opacity="0.2" />
      <text x="35" y="40" fill="#C4B5FD" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">2</text>
      <text x="65" y="40" fill="#F9FAFB" font-family="sans-serif" font-size="14" font-weight="700">Reconnection Dispatcher</text>

      <text x="25" y="80" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">CONNECTIVITY MONITORING:</text>
      <text x="25" y="98" fill="#E2E8F0" font-family="sans-serif" font-size="11">Custom Action subscribes to</text>
      <text x="25" y="114" fill="#E2E8F0" font-family="sans-serif" font-size="11">connectivity_plus stream.</text>
      <text x="25" y="130" fill="#E2E8F0" font-family="sans-serif" font-size="11">Drains queue sequentially on sync.</text>

      <rect x="20" y="150" width="240" height="150" rx="8" fill="#1F2937" />
      <text x="32" y="172" fill="#C4B5FD" font-family="monospace" font-size="10.5">// Sync Drain Loop (Dart)</text>
      <text x="32" y="192" fill="#E2E8F0" font-family="monospace" font-size="9.5">Connectivity().onConnectivityChanged</text>
      <text x="32" y="210" fill="#E2E8F0" font-family="monospace" font-size="9.5">.listen((status) async {</text>
      <text x="32" y="228" fill="#E2E8F0" font-family="monospace" font-size="9.5">  if (status != none) {</text>
      <text x="32" y="246" fill="#E2E8F0" font-family="monospace" font-size="9.5">    await drainPendingQueue();</text>
      <text x="32" y="264" fill="#E2E8F0" font-family="monospace" font-size="9.5">  }</text>
      <text x="32" y="282" fill="#E2E8F0" font-family="monospace" font-size="9.5">});</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M640,170 H670" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="670,165 675,170 670,175" fill="#8B5CF6" />

    <!-- Stage 3: Realtime Database & Presence -->
    <g transform="translate(685, 0)">
      <rect width="265" height="340" rx="12" fill="#111827" stroke="#10B981" stroke-width="1.5" />
      <circle cx="35" cy="35" r="16" fill="#10B981" fill-opacity="0.2" />
      <text x="35" y="40" fill="#34D399" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">3</text>
      <text x="65" y="40" fill="#F9FAFB" font-family="sans-serif" font-size="14" font-weight="700">Cloud Sync &amp; Presence</text>

      <text x="25" y="80" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">CONFIRMED DELIVERY:</text>
      <text x="25" y="98" fill="#E2E8F0" font-family="sans-serif" font-size="11">Message lands in Cloud Firestore</text>
      <text x="25" y="114" fill="#E2E8F0" font-family="sans-serif" font-size="11">or Supabase Realtime Channel.</text>
      <text x="25" y="130" fill="#E2E8F0" font-family="sans-serif" font-size="11">Checkmark turns to double-blue.</text>

      <rect x="20" y="150" width="225" height="150" rx="8" fill="#1F2937" />
      <text x="32" y="172" fill="#34D399" font-family="monospace" font-size="10.5">// Presence State System</text>
      <text x="32" y="192" fill="#E2E8F0" font-family="monospace" font-size="9.5">userPresenceRef.set({</text>
      <text x="32" y="210" fill="#E2E8F0" font-family="monospace" font-size="9.5">  isOnline: true,</text>
      <text x="32" y="228" fill="#E2E8F0" font-family="monospace" font-size="9.5">  lastSeen: serverTimestamp(),</text>
      <text x="32" y="246" fill="#E2E8F0" font-family="monospace" font-size="9.5">  typingInRoom: activeRoomId</text>
      <text x="32" y="264" fill="#E2E8F0" font-family="monospace" font-size="9.5">});</text>
      <text x="32" y="282" fill="#94A3B8" font-family="monospace" font-size="9.5">// onDisconnect().set(false)</text>
    </g>
  </g>
</svg>