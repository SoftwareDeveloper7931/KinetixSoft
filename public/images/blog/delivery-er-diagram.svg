<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="80" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">E-COMMERCE &amp; DELIVERY ERD</text>
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">3-Sided On-Demand Delivery Schema (ER Diagram)</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Entity Relationships for Customers, Merchants, Menu Catalog, Orders &amp; Dispatch</text>
  </g>

  <g transform="translate(80, 195)">
    
  <g transform="translate(0, 10)">
    <!-- merchants -->
    <g transform="translate(20, 0)">
      <rect width="220" height="165" rx="8" fill="#131926" stroke="#232A36" stroke-width="1.5" />
      <rect width="220" height="32" rx="8" fill="#1A2233" />
      <text x="15" y="21" fill="#F59E0B" font-family="monospace" font-size="13" font-weight="700">merchants</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#8A93A3" font-family="monospace" font-size="11">   name: string</text>
      <text x="15" y="96" fill="#8A93A3" font-family="monospace" font-size="11">   prep_time_min: int</text>
      <text x="15" y="118" fill="#8A93A3" font-family="monospace" font-size="11">   is_accepting: boolean</text>
      <text x="15" y="140" fill="#8A93A3" font-family="monospace" font-size="11">   stripe_account_id: text</text>
    </g>

    <!-- menu_items -->
    <g transform="translate(20, 190)">
      <rect width="220" height="155" rx="8" fill="#131926" stroke="#232A36" stroke-width="1.5" />
      <rect width="220" height="32" rx="8" fill="#1A2233" />
      <text x="15" y="21" fill="#E9EBEF" font-family="monospace" font-size="13" font-weight="700">menu_items</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#F59E0B" font-family="monospace" font-size="11">🔗 merchant_id: uuid [FK]</text>
      <text x="15" y="96" fill="#8A93A3" font-family="monospace" font-size="11">   name: string</text>
      <text x="15" y="118" fill="#10B981" font-family="monospace" font-size="11">   price: numeric</text>
      <text x="15" y="140" fill="#8A93A3" font-family="monospace" font-size="11">   is_available: boolean</text>
    </g>

    <!-- orders -->
    <g transform="translate(380, 0)">
      <rect width="270" height="225" rx="8" fill="#131926" stroke="#4A5FBD" stroke-width="2" />
      <rect width="270" height="32" rx="8" fill="#1D263B" />
      <text x="15" y="21" fill="#7E95F7" font-family="monospace" font-size="13" font-weight="700">orders [CORE STATE]</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#8A93A3" font-family="monospace" font-size="11">🔗 customer_id: uuid [FK]</text>
      <text x="15" y="96" fill="#F59E0B" font-family="monospace" font-size="11">🔗 merchant_id: uuid [FK]</text>
      <text x="15" y="118" fill="#10B981" font-family="monospace" font-size="11">🔗 driver_id: uuid [FK, nullable]</text>
      <text x="15" y="140" fill="#7E95F7" font-family="monospace" font-size="11">   status: OrderStatus [ENUM]</text>
      <text x="15" y="162" fill="#10B981" font-family="monospace" font-size="11">   subtotal: numeric</text>
      <text x="15" y="184" fill="#10B981" font-family="monospace" font-size="11">   delivery_fee: numeric</text>
      <text x="15" y="206" fill="#8A93A3" font-family="monospace" font-size="11">   delivery_address_geo: json</text>
    </g>

    <!-- order_items -->
    <g transform="translate(380, 245)">
      <rect width="270" height="125" rx="8" fill="#131926" stroke="#232A36" stroke-width="1.5" />
      <rect width="270" height="32" rx="8" fill="#1A2233" />
      <text x="15" y="21" fill="#E9EBEF" font-family="monospace" font-size="13" font-weight="700">order_items</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#7E95F7" font-family="monospace" font-size="11">🔗 order_id: uuid [FK]</text>
      <text x="15" y="96" fill="#8A93A3" font-family="monospace" font-size="11">🔗 menu_item_id: uuid [FK]</text>
      <text x="15" y="118" fill="#8A93A3" font-family="monospace" font-size="11">   qty: int, item_price: numeric</text>
    </g>

    <!-- live_delivery_dispatch -->
    <g transform="translate(770, 0)">
      <rect width="250" height="185" rx="8" fill="#131926" stroke="#10B981" stroke-width="1.5" />
      <rect width="250" height="32" rx="8" fill="#1A2233" />
      <text x="15" y="21" fill="#10B981" font-family="monospace" font-size="13" font-weight="700">delivery_dispatches</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#7E95F7" font-family="monospace" font-size="11">🔗 order_id: uuid [FK]</text>
      <text x="15" y="96" fill="#8A93A3" font-family="monospace" font-size="11">🔗 driver_id: uuid [FK]</text>
      <text x="15" y="118" fill="#8A93A3" font-family="monospace" font-size="11">   picked_up_at: timestamp</text>
      <text x="15" y="140" fill="#8A93A3" font-family="monospace" font-size="11">   delivered_at: timestamp</text>
      <text x="15" y="162" fill="#8A93A3" font-family="monospace" font-size="11">   proof_photo_url: text</text>
    </g>

    <!-- Connectors -->
    <path d="M240,75 H380" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4" />
    <path d="M650,75 H770" stroke="#10B981" stroke-width="2" stroke-dasharray="4" />
  </g>
  
  </g>

  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Database ER Architecture Series</text>
  </g>
</svg>