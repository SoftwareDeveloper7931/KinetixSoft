<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5FBD" />
      <stop offset="100%" stop-color="#364790" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Header Section -->
  <g transform="translate(80, 70)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="65" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">INTERNAL TOOLS</text>

    <!-- Title -->
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Retool Operations &amp; Admin Dashboard</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Direct SQL &amp; REST Querying with Role-Based Permission Controls</text>
  </g>

  <!-- Dynamic Content Area -->
  <g transform="translate(80, 200)">
    
  <g transform="translate(0, 20)">
    <rect width="680" height="340" rx="10" fill="#0E1420" stroke="#232A36" stroke-width="1.5" />
    <!-- Nav -->
    <rect width="680" height="40" rx="10" fill="#151D2A" />
    <text x="25" y="25" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">Operations Control Center</text>
    <rect x="520" y="8" width="140" height="24" rx="4" fill="#4A5FBD" />
    <text x="590" y="24" fill="#FFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">+ Export CSV</text>

    <!-- Stats row -->
    <g transform="translate(25, 55)">
      <rect width="190" height="60" rx="6" fill="#172030" />
      <text x="15" y="25" fill="#8A93A3" font-family="sans-serif" font-size="11">Active Users</text>
      <text x="15" y="48" fill="#E9EBEF" font-family="sans-serif" font-size="16" font-weight="700">14,290</text>

      <rect x="210" width="190" height="60" rx="6" fill="#172030" />
      <text x="225" y="25" fill="#8A93A3" font-family="sans-serif" font-size="11">Pending Approvals</text>
      <text x="225" y="48" fill="#F59E0B" font-family="sans-serif" font-size="16" font-weight="700">28 Records</text>

      <rect x="420" width="210" height="60" rx="6" fill="#172030" />
      <text x="435" y="25" fill="#8A93A3" font-family="sans-serif" font-size="11">Monthly Volume</text>
      <text x="435" y="48" fill="#10B981" font-family="sans-serif" font-size="16" font-weight="700">$340,120</text>
    </g>

    <!-- Table -->
    <g transform="translate(25, 130)">
      <rect width="630" height="185" rx="6" fill="#141B26" />
      <rect width="630" height="30" fill="#1B2433" />
      <text x="20" y="20" fill="#8A93A3" font-family="sans-serif" font-size="11">USER ID</text>
      <text x="140" y="20" fill="#8A93A3" font-family="sans-serif" font-size="11">NAME</text>
      <text x="280" y="20" fill="#8A93A3" font-family="sans-serif" font-size="11">STATUS</text>
      <text x="400" y="20" fill="#8A93A3" font-family="sans-serif" font-size="11">KYC VERIFIED</text>
      <text x="530" y="20" fill="#8A93A3" font-family="sans-serif" font-size="11">ACTIONS</text>

      <!-- Row 1 -->
      <text x="20" y="60" fill="#E9EBEF" font-family="monospace" font-size="11">#USR-8901</text>
      <text x="140" y="60" fill="#E9EBEF" font-family="sans-serif" font-size="12">Sarah Jenkins</text>
      <text x="280" y="60" fill="#10B981" font-family="sans-serif" font-size="11">● Active</text>
      <text x="400" y="60" fill="#E9EBEF" font-family="sans-serif" font-size="11">Yes (Stripe ID)</text>
      <rect x="525" y="45" width="80" height="22" rx="4" fill="#222C3D" />
      <text x="565" y="60" fill="#7E95F7" font-family="sans-serif" font-size="10" text-anchor="middle">View Details</text>

      <!-- Row 2 -->
      <text x="20" y="100" fill="#E9EBEF" font-family="monospace" font-size="11">#USR-8902</text>
      <text x="140" y="100" fill="#E9EBEF" font-family="sans-serif" font-size="12">Marcus Vance</text>
      <text x="280" y="100" fill="#F59E0B" font-family="sans-serif" font-size="11">● Review</text>
      <text x="400" y="100" fill="#F59E0B" font-family="sans-serif" font-size="11">Pending Upload</text>
      <rect x="525" y="85" width="80" height="22" rx="4" fill="#10B981" />
      <text x="565" y="100" fill="#FFF" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Approve</text>
    </g>

    <!-- Side Specs -->
    <g transform="translate(730, 20)">
      <rect width="310" height="95" rx="8" fill="#131926" stroke="#232A36" />
      <text x="20" y="32" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">Direct SQL &amp; API Access</text>
      <text x="20" y="55" fill="#8A93A3" font-family="sans-serif" font-size="11">Connects securely to PostgreSQL, MySQL, Snowflake, MongoDB, and internal microservice REST APIs.</text>

      <rect y="115" width="310" height="95" rx="8" fill="#131926" stroke="#232A36" />
      <text x="20" y="147" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">Audit Logging &amp; RBAC</text>
      <text x="20" y="170" fill="#8A93A3" font-family="sans-serif" font-size="11">Every button click, record modification, and database write is logged with employee identity.</text>
    </g>
  </g>
  
  </g>

  <!-- Watermark / Footer branding -->
  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Technical Architecture Series</text>
  </g>
</svg>