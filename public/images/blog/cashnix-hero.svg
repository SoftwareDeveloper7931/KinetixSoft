<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F1524" />
      <stop offset="100%" stop-color="#090E18" />
    </linearGradient>
    <linearGradient id="phoneGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5FBD" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1" />
    </linearGradient>
    <clipPath id="screenClip1">
      <rect x="0" y="0" width="220" height="460" rx="28" />
    </clipPath>
    <clipPath id="screenClip2">
      <rect x="0" y="0" width="200" height="420" rx="24" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid Pattern -->
  <g opacity="0.05">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Glows -->
  <circle cx="850" cy="340" r="280" fill="#4A5FBD" opacity="0.15" />
  <circle cx="1020" cy="400" r="220" fill="#06B6D4" opacity="0.12" />

  <!-- Left: Content & Badges -->
  <g transform="translate(80, 110)">
    <!-- App Icon and Status -->
    <g transform="translate(0, 0)">
      <rect width="72" height="72" rx="18" fill="#131927" stroke="#28344E" stroke-width="1.5" />
      <image href="/images/cashnix/cashnix-icon.png" x="4" y="4" width="64" height="64" />
      
      <g transform="translate(90, 12)">
        <rect width="160" height="24" rx="12" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" />
        <circle cx="14" cy="12" r="4" fill="#10B981" />
        <text x="26" y="16" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">LIVE ON GOOGLE PLAY</text>
        <text x="0" y="42" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Cashnix App</text>
      </g>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">Financial Forecasting</text>
    <text x="0" y="185" fill="#7185E4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="700" font-style="italic">In FlutterFlow</text>

    <!-- Description -->
    <text x="0" y="235" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">90-Day Liquidity Engine, What-If Simulators &amp; KPI Dashboards</text>
    <text x="0" y="260" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">Designed &amp; Shipped to Production by KinetixSoft</text>

    <!-- Highlights Card -->
    <g transform="translate(0, 305)">
      <rect width="440" height="110" rx="12" fill="#121724" stroke="#232A36" stroke-width="1.5" />
      
      <g transform="translate(25, 25)">
        <text x="0" y="18" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">100% Production Shipped</text>
        <text x="0" y="40" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Available worldwide on Android &amp; iOS devices</text>
        <text x="0" y="62" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">&#9733;&#9733;&#9733;&#9733;&#9733; 5.0 Rating on Google Play Store</text>
      </g>
    </g>
  </g>

  <!-- Right: Real App Phone Mockups -->
  <g transform="translate(680, 80)">
    <!-- Secondary Screen (Behind, Rotated) -->
    <g transform="translate(180, 40) rotate(8)">
      <rect width="216" height="436" rx="26" fill="#0C101A" stroke="#2D3B58" stroke-width="3" opacity="0.75" />
      <g clip-path="url(#screenClip2)" transform="translate(8, 8)">
        <image href="/images/cashnix/cashnix-screen-2.png" width="200" height="420" preserveAspectRatio="xMidYMin slice" />
      </g>
    </g>

    <!-- Primary Screen (Front, Sharp) -->
    <g transform="translate(20, 15)">
      <!-- Drop Shadow Card -->
      <rect x="-10" y="-10" width="244" height="484" rx="34" fill="#090E18" opacity="0.6" />
      <!-- Device Shell -->
      <rect width="224" height="464" rx="30" fill="#0E131F" stroke="#4A5FBD" stroke-width="2.5" />
      <!-- Camera Notch -->
      <rect x="72" y="8" width="80" height="12" rx="6" fill="#000000" />
      <!-- App Screen Content -->
      <g clip-path="url(#screenClip1)" transform="translate(2, 2)">
        <image href="/images/cashnix/cashnix-screen-1.png" width="220" height="460" preserveAspectRatio="xMidYMin slice" />
      </g>
    </g>
  </g>

  <!-- Bottom Brand Signature -->
  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">&#8226; Client Production Showcase</text>
  </g>
</svg>