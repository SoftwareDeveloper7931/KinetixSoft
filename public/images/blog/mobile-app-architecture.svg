<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5FBD" />
      <stop offset="100%" stop-color="#364790" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Header Section -->
  <g transform="translate(80, 70)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="65" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">SYSTEM ARCHITECTURE</text>

    <!-- Title -->
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Production Mobile Architecture in FlutterFlow</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">State Management, Secure Storage, Background Services &amp; Offline Sync</text>
  </g>

  <!-- Dynamic Content Area -->
  <g transform="translate(80, 200)">
    
  <g transform="translate(0, 20)">
    <!-- Layer 1: Client UI -->
    <rect width="1040" height="60" rx="8" fill="#141C2B" stroke="#4A5FBD" stroke-width="1.5" />
    <text x="30" y="35" fill="#7E95F7" font-family="sans-serif" font-size="13" font-weight="700">FLUTTER CLIENT LAYER (iOS &amp; Android Native ARM)</text>
    <text x="500" y="35" fill="#8A93A3" font-family="sans-serif" font-size="11">Widgets • 60 FPS Skia/Impeller Render Tree • Local State • Biometric Auth</text>

    <!-- Layer 2: Business Logic &amp; Actions -->
    <rect y="80" width="1040" height="70" rx="8" fill="#101724" stroke="#232A36" />
    <text x="30" y="112" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">APPLICATION LOGIC LAYER</text>
    <text x="30" y="132" fill="#8A93A3" font-family="sans-serif" font-size="11">Custom Dart Actions • Local Cache / SQLite • Notification Scheduler • Offline Queue Sync</text>

    <!-- Layer 3: Network &amp; Gateway -->
    <rect y="170" width="1040" height="70" rx="8" fill="#0D1320" stroke="#232A36" />
    <text x="30" y="202" fill="#F59E0B" font-family="sans-serif" font-size="13" font-weight="700">SECURITY &amp; API GATEWAY</text>
    <text x="30" y="222" fill="#8A93A3" font-family="sans-serif" font-size="11">JWT Token Validation • HTTPS REST Endpoints • Rate Limiting • Payment Pre-Auth Proxy</text>

    <!-- Layer 4: Cloud Backends -->
    <g transform="translate(0, 260)">
      <rect width="330" height="80" rx="8" fill="#131A26" stroke="#10B981" />
      <text x="20" y="32" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">FIREBASE / SUPABASE</text>
      <text x="20" y="55" fill="#8A93A3" font-family="sans-serif" font-size="11">Row-Level Security &amp; Real-Time Listeners</text>

      <rect x="350" width="340" height="80" rx="8" fill="#131A26" stroke="#3B82F6" />
      <text x="20" y="32" fill="#3B82F6" font-family="sans-serif" font-size="12" font-weight="700">CLOUD FUNCTIONS (NODE.JS)</text>
      <text x="20" y="55" fill="#8A93A3" font-family="sans-serif" font-size="11">Server-Side Math, Webhooks &amp; Automated Tasks</text>

      <rect x="710" width="330" height="80" rx="8" fill="#131A26" stroke="#F43F5E" />
      <text x="20" y="32" fill="#F43F5E" font-family="sans-serif" font-size="12" font-weight="700">THIRD-PARTY INTEGRATIONS</text>
      <text x="20" y="55" fill="#8A93A3" font-family="sans-serif" font-size="11">Stripe, Google Maps, Twilio, OpenAI, Plaid</text>
    </g>
  </g>
  
  </g>

  <!-- Watermark / Footer branding -->
  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Technical Architecture Series</text>
  </g>
</svg>