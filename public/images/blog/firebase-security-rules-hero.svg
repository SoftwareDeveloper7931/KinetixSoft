<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="80" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">SECURITY ENGINEERING</text>
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Firebase Security Rules: Production Architecture</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Zero-Trust Authorization, Custom Validator Functions &amp; Data Immutability</text>
  </g>

  <g transform="translate(80, 195)">
    
  <g transform="translate(0, 15)">
    <g transform="translate(30, 0)">
      <rect width="460" height="340" rx="10" fill="#121724" stroke="#4A5FBD" stroke-width="2" />
      <text x="25" y="38" fill="#7E95F7" font-family="sans-serif" font-size="16" font-weight="700">1. INCOMING REQUEST INSPECTOR</text>
      <rect x="25" y="60" width="410" height="50" rx="6" fill="#182030" />
      <text x="35" y="82" fill="#E9EBEF" font-family="monospace" font-size="11">request.auth != null</text>
      <text x="35" y="98" fill="#8A93A3" font-family="sans-serif" font-size="10">Cryptographically verifies Firebase ID token from client</text>

      <rect x="25" y="125" width="410" height="50" rx="6" fill="#182030" />
      <text x="35" y="147" fill="#E9EBEF" font-family="monospace" font-size="11">request.auth.uid == userId</text>
      <text x="35" y="163" fill="#8A93A3" font-family="sans-serif" font-size="10">Enforces data ownership: users cannot modify peers' records</text>

      <rect x="25" y="190" width="410" height="60" rx="6" fill="#182030" />
      <text x="35" y="212" fill="#10B981" font-family="monospace" font-size="11">!('role' in request.resource.data.diff(...))</text>
      <text x="35" y="232" fill="#8A93A3" font-family="sans-serif" font-size="10">Field immutability: prevents client from self-assigning admin rights</text>

      <rect x="25" y="265" width="410" height="50" rx="6" fill="#10B981" fill-opacity="0.1" stroke="#10B981" />
      <text x="35" y="295" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">DECISION: ALLOW / DENY IN &lt;2ms</text>
    </g>

    <g transform="translate(540, 0)">
      <rect width="470" height="340" rx="10" fill="#121724" stroke="#232A36" stroke-width="1.5" />
      <text x="25" y="38" fill="#10B981" font-family="sans-serif" font-size="16" font-weight="700">2. PRODUCTION VALIDATOR PATTERN</text>
      <rect x="25" y="60" width="420" height="255" rx="6" fill="#0D131C" />
      <text x="40" y="85" fill="#F43F5E" font-family="monospace" font-size="11">function isValidUser(data) {</text>
      <text x="55" y="110" fill="#E9EBEF" font-family="monospace" font-size="11">  return data.email is string</text>
      <text x="55" y="130" fill="#E9EBEF" font-family="monospace" font-size="11">    &amp;&amp; data.email.size() &gt; 5</text>
      <text x="55" y="150" fill="#E9EBEF" font-family="monospace" font-size="11">    &amp;&amp; data.role in ['rider', 'driver'];</text>
      <text x="40" y="170" fill="#F43F5E" font-family="monospace" font-size="11">}</text>
      <text x="40" y="200" fill="#7E95F7" font-family="monospace" font-size="11">match /users/{userId} {</text>
      <text x="55" y="225" fill="#E9EBEF" font-family="monospace" font-size="11">  allow create: if isOwner(userId)</text>
      <text x="75" y="245" fill="#10B981" font-family="monospace" font-size="11">    &amp;&amp; isValidUser(request.resource.data);</text>
      <text x="55" y="270" fill="#E9EBEF" font-family="monospace" font-size="11">  allow update: if isOwner(userId)...</text>
      <text x="40" y="295" fill="#7E95F7" font-family="monospace" font-size="11">}</text>
    </g>
  </g>
  
  </g>

  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Database ER Architecture Series</text>
  </g>
</svg>