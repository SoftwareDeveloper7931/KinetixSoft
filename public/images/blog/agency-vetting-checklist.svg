<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5FBD" />
      <stop offset="100%" stop-color="#364790" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Header Section -->
  <g transform="translate(80, 70)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="65" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">EVALUATION MATRIX</text>

    <!-- Title -->
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">How to Evaluate an App Development Studio</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Key Verification Criteria: Architecture Discipline, Live Apps, &amp; Legal Protections</text>
  </g>

  <!-- Dynamic Content Area -->
  <g transform="translate(80, 200)">
    
  <g transform="translate(0, 20)">
    <g transform="translate(20, 0)">
      <rect width="320" height="340" rx="10" fill="#131926" stroke="#232A36" />
      <text x="25" y="35" fill="#EF4444" font-family="sans-serif" font-size="12" font-weight="700">RED FLAGS TO AVOID</text>
      <text x="25" y="70" fill="#E9EBEF" font-family="sans-serif" font-size="12">❌ Quoting fixed timeline without scoping</text>
      <text x="25" y="105" fill="#E9EBEF" font-family="sans-serif" font-size="12">❌ Only screenshots, no downloadable apps</text>
      <text x="25" y="140" fill="#E9EBEF" font-family="sans-serif" font-size="12">❌ No questions about data models or RLS</text>
      <text x="25" y="175" fill="#E9EBEF" font-family="sans-serif" font-size="12">❌ Resistance to IP assignment / NDA</text>
      <text x="25" y="210" fill="#E9EBEF" font-family="sans-serif" font-size="12">❌ Building backend logic on client device</text>
      <text x="25" y="245" fill="#E9EBEF" font-family="sans-serif" font-size="12">❌ No custom code capabilities beyond UI</text>
    </g>

    <g transform="translate(370, 0)">
      <rect width="320" height="340" rx="10" fill="#131926" stroke="#10B981" stroke-width="2" />
      <text x="25" y="35" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">WHAT TO DEMAND</text>
      <text x="25" y="70" fill="#E9EBEF" font-family="sans-serif" font-size="12">✅ Live App Store &amp; Play Store links</text>
      <text x="25" y="105" fill="#E9EBEF" font-family="sans-serif" font-size="12">✅ Formal Discovery &amp; Technical Architecture</text>
      <text x="25" y="140" fill="#E9EBEF" font-family="sans-serif" font-size="12">✅ Custom Flutter/Dart &amp; Cloud Functions</text>
      <text x="25" y="175" fill="#E9EBEF" font-family="sans-serif" font-size="12">✅ Milestone-based contracts &amp; Escrow</text>
      <text x="25" y="210" fill="#E9EBEF" font-family="sans-serif" font-size="12">✅ Work-for-hire full IP assignment</text>
      <text x="25" y="245" fill="#E9EBEF" font-family="sans-serif" font-size="12">✅ Post-launch warranty &amp; SLA coverage</text>
    </g>

    <g transform="translate(720, 0)">
      <rect width="300" height="340" rx="10" fill="#131926" stroke="#4A5FBD" />
      <text x="25" y="35" fill="#7E95F7" font-family="sans-serif" font-size="12" font-weight="700">KINETIXSOFT BENCHMARK</text>
      <text x="25" y="65" fill="#E9EBEF" font-family="sans-serif" font-size="14" font-weight="700">Real Production Delivery</text>
      <text x="25" y="95" fill="#8A93A3" font-family="sans-serif" font-size="11">We built and launched Cashnix (Fintech live on App Store) and enterprise systems across 5 platforms.</text>

      <rect x="25" y="140" width="250" height="80" rx="6" fill="#1C2433" />
      <text x="35" y="165" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="600">Weekly Video Demos:</text>
      <text x="35" y="185" fill="#8A93A3" font-family="sans-serif" font-size="10">Test actual builds on TestFlight &amp; Firebase</text>
      <text x="35" y="202" fill="#8A93A3" font-family="sans-serif" font-size="10">App Distribution every single sprint.</text>

      <rect x="25" y="235" width="250" height="80" rx="6" fill="#1C2433" />
      <text x="35" y="260" fill="#7E95F7" font-family="sans-serif" font-size="11" font-weight="600">Free Scoping Sessions:</text>
      <text x="35" y="280" fill="#8A93A3" font-family="sans-serif" font-size="10">Direct architecture conversations with</text>
      <text x="35" y="297" fill="#8A93A3" font-family="sans-serif" font-size="10">engineers, not commission sales reps.</text>
    </g>
  </g>
  
  </g>

  <!-- Watermark / Footer branding -->
  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Technical Architecture Series</text>
  </g>
</svg>