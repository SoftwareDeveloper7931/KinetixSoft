<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="80" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">FIREBASE & SUPABASE SCHEMA</text>
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Full-Stack FlutterFlow Data Architecture (ER Diagram)</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Relational Schema for Multi-Tenant SaaS, Roles & Cloud Datastores</text>
  </g>

  <g transform="translate(80, 195)">
    
  <g transform="translate(0, 10)">
    <!-- organizations -->
    <g transform="translate(20, 0)">
      <rect width="230" height="165" rx="8" fill="#131926" stroke="#4A5FBD" stroke-width="1.5" />
      <rect width="230" height="32" rx="8" fill="#1D263B" />
      <text x="15" y="21" fill="#7E95F7" font-family="monospace" font-size="13" font-weight="700">organizations</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#8A93A3" font-family="monospace" font-size="11">   name: string</text>
      <text x="15" y="96" fill="#8A93A3" font-family="monospace" font-size="11">   plan_tier: 'starter'|'pro'</text>
      <text x="15" y="118" fill="#8A93A3" font-family="monospace" font-size="11">   seat_limit: int</text>
      <text x="15" y="140" fill="#8A93A3" font-family="monospace" font-size="11">   created_at: timestamp</text>
    </g>

    <!-- users -->
    <g transform="translate(390, 0)">
      <rect width="250" height="195" rx="8" fill="#131926" stroke="#4A5FBD" stroke-width="2" />
      <rect width="250" height="32" rx="8" fill="#1D263B" />
      <text x="15" y="21" fill="#7E95F7" font-family="monospace" font-size="13" font-weight="700">users &amp; profiles</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK / auth.uid]</text>
      <text x="15" y="74" fill="#7E95F7" font-family="monospace" font-size="11">🔗 org_id: uuid [FK]</text>
      <text x="15" y="96" fill="#8A93A3" font-family="monospace" font-size="11">   email: string</text>
      <text x="15" y="118" fill="#10B981" font-family="monospace" font-size="11">   role: 'admin'|'member'</text>
      <text x="15" y="140" fill="#8A93A3" font-family="monospace" font-size="11">   avatar_url: text</text>
      <text x="15" y="162" fill="#8A93A3" font-family="monospace" font-size="11">   last_active_at: timestamp</text>
    </g>

    <!-- app_resources -->
    <g transform="translate(780, 0)">
      <rect width="240" height="175" rx="8" fill="#131926" stroke="#10B981" stroke-width="1.5" />
      <rect width="240" height="32" rx="8" fill="#1A2233" />
      <text x="15" y="21" fill="#10B981" font-family="monospace" font-size="13" font-weight="700">app_resources</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#7E95F7" font-family="monospace" font-size="11">🔗 org_id: uuid [FK]</text>
      <text x="15" y="96" fill="#8A93A3" font-family="monospace" font-size="11">🔗 owner_id: uuid [FK]</text>
      <text x="15" y="118" fill="#8A93A3" font-family="monospace" font-size="11">   resource_type: string</text>
      <text x="15" y="140" fill="#8A93A3" font-family="monospace" font-size="11">   payload_data: jsonb</text>
    </g>

    <!-- audit_logs -->
    <g transform="translate(390, 230)">
      <rect width="250" height="140" rx="8" fill="#131926" stroke="#232A36" stroke-width="1.5" />
      <rect width="250" height="32" rx="8" fill="#1A2233" />
      <text x="15" y="21" fill="#F59E0B" font-family="monospace" font-size="13" font-weight="700">security_audit_logs</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#7E95F7" font-family="monospace" font-size="11">🔗 user_id: uuid [FK]</text>
      <text x="15" y="96" fill="#8A93A3" font-family="monospace" font-size="11">   action: string ('LOGIN'|'WRITE')</text>
      <text x="15" y="118" fill="#8A93A3" font-family="monospace" font-size="11">   ip_address: text, timestamp</text>
    </g>

    <!-- Connectors -->
    <path d="M250,75 H390" stroke="#7E95F7" stroke-width="2" stroke-dasharray="4" />
    <path d="M640,75 H780" stroke="#7E95F7" stroke-width="2" stroke-dasharray="4" />
  </g>
  
  </g>

  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Database ER Architecture Series</text>
  </g>
</svg>