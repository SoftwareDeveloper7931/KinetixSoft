<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5FBD" />
      <stop offset="100%" stop-color="#364790" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Header Section -->
  <g transform="translate(80, 70)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="65" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">GLOBAL ENGINEERING</text>

    <!-- Title -->
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Cross-Platform International Deployment</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Multilingual Localisation, Regional Compliance (GDPR, PIPEDA, KSA 2030), & RTL Support</text>
  </g>

  <!-- Dynamic Content Area -->
  <g transform="translate(80, 200)">
    
  <g transform="translate(0, 20)">
    <!-- Architecture cards -->
    <g transform="translate(40, 0)">
      <rect width="320" height="340" rx="10" fill="#131926" stroke="#232A36" />
      <text x="25" y="35" fill="#3B82F6" font-family="sans-serif" font-size="12" font-weight="700">EUROPE & UK • GDPR</text>
      <text x="25" y="65" fill="#E9EBEF" font-family="sans-serif" font-size="14" font-weight="600">Strict Data Privacy Baseline</text>
      <text x="25" y="95" fill="#8A93A3" font-family="sans-serif" font-size="11">• EU-Region Hosting (Frankfurt / Dublin)</text>
      <text x="25" y="120" fill="#8A93A3" font-family="sans-serif" font-size="11">• Zero unconsented third-party trackers</text>
      <text x="25" y="145" fill="#8A93A3" font-family="sans-serif" font-size="11">• Data subject export & erasure workflows</text>
      <text x="25" y="170" fill="#8A93A3" font-family="sans-serif" font-size="11">• Local payments: iDEAL, Bancontact, Klarna</text>
      <rect x="25" y="210" width="270" height="90" rx="6" fill="#1A2230" />
      <text x="40" y="235" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="600">Covered Countries:</text>
      <text x="40" y="255" fill="#8A93A3" font-family="sans-serif" font-size="11">Germany, UK, France, Netherlands, Spain,</text>
      <text x="40" y="275" fill="#8A93A3" font-family="sans-serif" font-size="11">Sweden, Italy, Poland, Pan-Europe</text>
    </g>

    <g transform="translate(400, 0)">
      <rect width="320" height="340" rx="10" fill="#131926" stroke="#4A5FBD" stroke-width="2" />
      <text x="25" y="35" fill="#7E95F7" font-family="sans-serif" font-size="12" font-weight="700">GCC & GULF • VISION 2030</text>
      <text x="25" y="65" fill="#E9EBEF" font-family="sans-serif" font-size="14" font-weight="600">Bilingual Arabic & RTL Layouts</text>
      <text x="25" y="95" fill="#8A93A3" font-family="sans-serif" font-size="11">• True bidirectional RTL layout mirroring</text>
      <text x="25" y="120" fill="#8A93A3" font-family="sans-serif" font-size="11">• Native Cairo / IBM Plex Arabic typography</text>
      <text x="25" y="145" fill="#8A93A3" font-family="sans-serif" font-size="11">• GCC Gateways: Tap, PayTabs, QNB, Telr</text>
      <text x="25" y="170" fill="#8A93A3" font-family="sans-serif" font-size="11">• Timezone overlap with UAE & KSA workdays</text>
      <rect x="25" y="210" width="270" height="90" rx="6" fill="#1A2230" />
      <text x="40" y="235" fill="#7E95F7" font-family="sans-serif" font-size="11" font-weight="600">Covered Countries:</text>
      <text x="40" y="255" fill="#8A93A3" font-family="sans-serif" font-size="11">UAE (Dubai/Abu Dhabi), Saudi Arabia,</text>
      <text x="40" y="275" fill="#8A93A3" font-family="sans-serif" font-size="11">Qatar, Kuwait, Bahrain, Oman, Gulf</text>
    </g>

    <g transform="translate(760, 0)">
      <rect width="280" height="340" rx="10" fill="#131926" stroke="#232A36" />
      <text x="25" y="35" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="700">AMERICAS & APAC</text>
      <text x="25" y="65" fill="#E9EBEF" font-family="sans-serif" font-size="14" font-weight="600">Rapid Commercial Delivery</text>
      <text x="25" y="95" fill="#8A93A3" font-family="sans-serif" font-size="11">• USA: Stripe, Plaid, HIPAA-ready</text>
      <text x="25" y="120" fill="#8A93A3" font-family="sans-serif" font-size="11">• Canada: Bilingual FR/EN, Law 25</text>
      <text x="25" y="145" fill="#8A93A3" font-family="sans-serif" font-size="11">• Australia: AEST morning overlap, BPAY</text>
      <text x="25" y="170" fill="#8A93A3" font-family="sans-serif" font-size="11">• Singapore: PDPA & Southeast Asia hub</text>
      <rect x="25" y="210" width="230" height="90" rx="6" fill="#1A2230" />
      <text x="40" y="235" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="600">40–60% Rate Advantage</text>
      <text x="40" y="255" fill="#8A93A3" font-family="sans-serif" font-size="11">Same quality, western contract terms,</text>
      <text x="40" y="275" fill="#8A93A3" font-family="sans-serif" font-size="11">and dedicated sprint accountability.</text>
    </g>
  </g>
  
  </g>

  <!-- Watermark / Footer branding -->
  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Technical Architecture Series</text>
  </g>
</svg>