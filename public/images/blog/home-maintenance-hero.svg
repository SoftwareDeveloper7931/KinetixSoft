<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5FBD" />
      <stop offset="100%" stop-color="#364790" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Header Section -->
  <g transform="translate(80, 70)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="65" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">FIELD SERVICES</text>

    <!-- Title -->
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">On-Demand Home Services & Dispatch</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Service Scheduling, Before/After Proof-of-Work, & Digital Invoices</text>
  </g>

  <!-- Dynamic Content Area -->
  <g transform="translate(80, 200)">
    
  <g transform="translate(0, 20)">
    <!-- Booking screen -->
    <g transform="translate(40, 0)">
      <rect width="300" height="340" rx="12" fill="url(#cardGrad)" stroke="#232A36" stroke-width="1.5" />
      <text x="25" y="35" fill="#E9EBEF" font-family="sans-serif" font-size="14" font-weight="700">Book Home Service</text>

      <g transform="translate(25, 55)">
        <rect width="115" height="60" rx="6" fill="#1C2433" stroke="#4A5FBD" />
        <text x="20" y="30" fill="#FFF" font-family="sans-serif" font-size="12">🔧 Plumbing</text>
        <text x="20" y="48" fill="#10B981" font-family="sans-serif" font-size="10">$85/hr</text>

        <rect x="135" width="115" height="60" rx="6" fill="#1C2433" />
        <text x="155" y="30" fill="#8A93A3" font-family="sans-serif" font-size="12">⚡ Electrical</text>
        <text x="155" y="48" fill="#10B981" font-family="sans-serif" font-size="10">$95/hr</text>
      </g>

      <text x="25" y="145" fill="#E9EBEF" font-family="sans-serif" font-size="12" font-weight="600">Select Date & Arrival Window</text>
      <rect x="25" y="160" width="250" height="40" rx="6" fill="#151C28" stroke="#232A36" />
      <text x="40" y="185" fill="#7E95F7" font-family="sans-serif" font-size="12">Tomorrow, 10:00 AM – 12:00 PM</text>

      <text x="25" y="225" fill="#E9EBEF" font-family="sans-serif" font-size="12" font-weight="600">Describe the Issue</text>
      <rect x="25" y="238" width="250" height="40" rx="6" fill="#151C28" stroke="#232A36" />
      <text x="40" y="263" fill="#8A93A3" font-family="sans-serif" font-size="11">Kitchen sink pipe leaking under cabinet...</text>

      <rect x="25" y="290" width="250" height="38" rx="6" fill="#4A5FBD" />
      <text x="150" y="314" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Confirm Service Request</text>
    </g>

    <!-- Field Tech Proof-of-Work -->
    <g transform="translate(380, 0)">
      <rect width="320" height="340" rx="12" fill="url(#cardGrad)" stroke="#232A36" stroke-width="1.5" />
      <text x="25" y="35" fill="#E9EBEF" font-family="sans-serif" font-size="14" font-weight="700">Technician Job Verification</text>

      <g transform="translate(25, 60)">
        <rect width="130" height="110" rx="6" fill="#18202E" stroke="#EF4444" stroke-width="1" />
        <text x="65" y="55" fill="#EF4444" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">BEFORE PHOTO</text>
        <text x="65" y="80" fill="#8A93A3" font-family="sans-serif" font-size="10" text-anchor="middle">Burst pipe identified</text>

        <rect x="140" width="130" height="110" rx="6" fill="#18202E" stroke="#10B981" stroke-width="1" />
        <text x="205" y="55" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">AFTER PHOTO</text>
        <text x="205" y="80" fill="#8A93A3" font-family="sans-serif" font-size="10" text-anchor="middle">Valve & seal replaced</text>
      </g>

      <!-- Digital Signoff -->
      <rect x="25" y="195" width="270" height="75" rx="6" fill="#121824" stroke="#232A36" />
      <text x="35" y="220" fill="#E9EBEF" font-family="sans-serif" font-size="11" font-weight="600">Homeowner Digital Signature:</text>
      <path d="M40,250 Q70,230 110,248 T180,240 T220,245" fill="none" stroke="#7E95F7" stroke-width="2" />

      <rect x="25" y="285" width="270" height="38" rx="6" fill="#10B981" />
      <text x="160" y="309" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Generate Invoice ($185.00)</text>
    </g>

    <!-- Platform Specs -->
    <g transform="translate(740, 30)">
      <rect width="300" height="85" rx="8" fill="#131926" stroke="#232A36" />
      <text x="20" y="32" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">Emergency & Scheduled Slots</text>
      <text x="20" y="55" fill="#8A93A3" font-family="sans-serif" font-size="11">Real-time calendar sync prevents double bookings while supporting 2-hour emergency dispatch.</text>

      <rect y="105" width="300" height="85" rx="8" fill="#131926" stroke="#232A36" />
      <text x="20" y="137" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">Offline Field Logging</text>
      <text x="20" y="160" fill="#8A93A3" font-family="sans-serif" font-size="11">Technicians in basements work uninterrupted; job photos and signatures sync when reconnected.</text>

      <rect y="210" width="300" height="85" rx="8" fill="#131926" stroke="#232A36" />
      <text x="20" y="242" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">Contractor Payouts</text>
      <text x="20" y="265" fill="#8A93A3" font-family="sans-serif" font-size="11">Automatic calculation of service commission, tip distribution, and weekly direct bank payouts.</text>
    </g>
  </g>
  
  </g>

  <!-- Watermark / Footer branding -->
  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Technical Architecture Series</text>
  </g>
</svg>