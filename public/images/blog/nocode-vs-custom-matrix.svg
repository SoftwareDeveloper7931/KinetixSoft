<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="70" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">STRATEGIC GUIDE</text>
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">No-Code / Low-Code vs Traditional Custom Development</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Analyzing Capital Allocation, Deployment Velocity, Scalability &amp; Total Cost of Ownership</text>
  </g>

  <g transform="translate(80, 200)">
    
  <g transform="translate(0, 15)">
    <g transform="translate(40, 0)">
      <rect width="450" height="340" rx="10" fill="#121724" stroke="#10B981" stroke-width="2" />
      <text x="30" y="40" fill="#10B981" font-family="sans-serif" font-size="18" font-weight="700">Modern Low-Code (FlutterFlow / Bubble)</text>
      <g transform="translate(30, 65)">
        <text x="0" y="20" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600">Speed to Market: 4 to 8 Weeks</text>
        <text x="0" y="40" fill="#8A93A3" font-family="sans-serif" font-size="12">Test real market demand with live paying customers in weeks.</text>
        <text x="0" y="75" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600">Budget Range: $4,000 – $18,000</text>
        <text x="0" y="95" fill="#8A93A3" font-family="sans-serif" font-size="12">Preserve 70% of founder capital for customer acquisition and marketing.</text>
        <text x="0" y="130" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600">Iteration Agility: Hours, not Sprints</text>
        <text x="0" y="150" fill="#8A93A3" font-family="sans-serif" font-size="12">Pivot features, modify database schemas, and redesign UI instantly.</text>
        <text x="0" y="185" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600">Enterprise Cloud Scalability</text>
        <text x="0" y="205" fill="#8A93A3" font-family="sans-serif" font-size="12">Built on Google Cloud, Firebase, and Supabase auto-scaling rails.</text>
      </g>
    </g>

    <g transform="translate(550, 0)">
      <rect width="450" height="340" rx="10" fill="#121724" stroke="#232A36" stroke-width="1.5" />
      <text x="30" y="40" fill="#E9EBEF" font-family="sans-serif" font-size="18" font-weight="700">Traditional Scratch Code (Swift + Kotlin)</text>
      <g transform="translate(30, 65)">
        <text x="0" y="20" fill="#8A93A3" font-family="sans-serif" font-size="13" font-weight="600">Speed to Market: 6 to 12 Months</text>
        <text x="0" y="40" fill="#8A93A3" font-family="sans-serif" font-size="12">Long development cycles increase risk of market timing misses.</text>
        <text x="0" y="75" fill="#8A93A3" font-family="sans-serif" font-size="13" font-weight="600">Budget Range: $60,000 – $150,000+</text>
        <text x="0" y="95" fill="#8A93A3" font-family="sans-serif" font-size="12">Heavy capital outlay before validating product-market fit.</text>
        <text x="0" y="130" fill="#8A93A3" font-family="sans-serif" font-size="13" font-weight="600">High Overhead Engineering Teams</text>
        <text x="0" y="150" fill="#8A93A3" font-family="sans-serif" font-size="12">Requires separate iOS, Android, and backend engineers.</text>
        <text x="0" y="185" fill="#8A93A3" font-family="sans-serif" font-size="13" font-weight="600">When it's actually justified:</text>
        <text x="0" y="205" fill="#8A93A3" font-family="sans-serif" font-size="12">Proprietary 3D graphics, low-level Bluetooth LE drivers, or AAA mobile gaming.</text>
      </g>
    </g>
  </g>
  
  </g>

  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Engineering Blueprint Series</text>
  </g>
</svg>