<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <g transform="translate(80, 70)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="70" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">FRAMEWORK COMPARISON</text>
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">FlutterFlow vs React Native: Technical Comparison</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Development Velocity, UI Performance, Native Module Interop &amp; Cost Analysis</text>
  </g>

  <g transform="translate(80, 200)">
    
  <g transform="translate(0, 15)">
    <g transform="translate(40, 0)">
      <rect width="450" height="340" rx="10" fill="#121724" stroke="#4A5FBD" stroke-width="2" />
      <text x="30" y="40" fill="#7E95F7" font-family="sans-serif" font-size="18" font-weight="700">FlutterFlow (Flutter / Dart)</text>
      <g transform="translate(30, 65)">
        <text x="0" y="20" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="600">✓ 40–60% Faster Time to Market</text>
        <text x="0" y="40" fill="#8A93A3" font-family="sans-serif" font-size="12">Visual builder accelerates UI layout without writing boilerplate.</text>
        <text x="0" y="75" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="600">✓ Native 60 FPS Skia Rendering</text>
        <text x="0" y="95" fill="#8A93A3" font-family="sans-serif" font-size="12">Direct hardware rendering eliminates JS bridge frame hiccups.</text>
        <text x="0" y="130" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="600">✓ Complete Code Export</text>
        <text x="0" y="150" fill="#8A93A3" font-family="sans-serif" font-size="12">Download standard clean Flutter / Dart codebase at any time.</text>
        <text x="0" y="185" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="600">✓ Predictable Maintenance Cost</text>
        <text x="0" y="205" fill="#8A93A3" font-family="sans-serif" font-size="12">Unified UI engine means zero iOS vs Android layout divergence.</text>
      </g>
    </g>

    <g transform="translate(550, 0)">
      <rect width="450" height="340" rx="10" fill="#121724" stroke="#232A36" stroke-width="1.5" />
      <text x="30" y="40" fill="#E9EBEF" font-family="sans-serif" font-size="18" font-weight="700">React Native (Traditional)</text>
      <g transform="translate(30, 65)">
        <text x="0" y="20" fill="#8A93A3" font-family="sans-serif" font-size="13" font-weight="600">• Slower Initial MVP Scoping</text>
        <text x="0" y="40" fill="#8A93A3" font-family="sans-serif" font-size="12">Every screen, state container, and hook coded manually from scratch.</text>
        <text x="0" y="75" fill="#8A93A3" font-family="sans-serif" font-size="13" font-weight="600">• JavaScript Bridge Overhead</text>
        <text x="0" y="95" fill="#8A93A3" font-family="sans-serif" font-size="12">Bridge serialization can cause dropped frames in heavy gesture lists.</text>
        <text x="0" y="130" fill="#8A93A3" font-family="sans-serif" font-size="13" font-weight="600">• Frequent Dependency Conflicts</text>
        <text x="0" y="150" fill="#8A93A3" font-family="sans-serif" font-size="12">Cocoapods, Gradle, and npm package version mismatches require maintenance.</text>
        <text x="0" y="185" fill="#8A93A3" font-family="sans-serif" font-size="13" font-weight="600">• High Agency Development Rates</text>
        <text x="0" y="205" fill="#8A93A3" font-family="sans-serif" font-size="12">Traditional agencies charge $50k–$100k+ for initial iOS &amp; Android builds.</text>
      </g>
    </g>
  </g>
  
  </g>

  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Engineering Blueprint Series</text>
  </g>
</svg>