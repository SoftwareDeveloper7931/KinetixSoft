<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5FBD" />
      <stop offset="100%" stop-color="#364790" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Header Section -->
  <g transform="translate(80, 70)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="65" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">FLUTTERFLOW ARCHITECTURE</text>

    <!-- Title -->
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">On-Demand Delivery Ecosystem</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Synchronized 3-Sided Platform: Customer, Driver, and Merchant</text>
  </g>

  <!-- Dynamic Content Area -->
  <g transform="translate(80, 200)">
    
  <!-- Customer App -->
  <g transform="translate(0, 20)">
    <rect width="320" height="360" rx="12" fill="url(#cardGrad)" stroke="#232A36" stroke-width="1.5" />
    <rect x="20" y="20" width="280" height="35" rx="6" fill="#1C2433" />
    <text x="35" y="42" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600">Customer Mobile App</text>
    <circle cx="280" cy="37" r="4" fill="#10B981" />

    <!-- UI Mockup -->
    <rect x="20" y="70" width="280" height="120" rx="8" fill="#101520" />
    <path d="M40,160 Q120,90 200,150 T280,100" fill="none" stroke="#4A5FBD" stroke-width="3" stroke-dasharray="4" />
    <circle cx="160" cy="120" r="10" fill="#4A5FBD" />
    <text x="160" y="124" fill="#FFFFFF" font-family="sans-serif" font-size="10" text-anchor="middle">🛵</text>
    <text x="35" y="95" fill="#8A93A3" font-family="sans-serif" font-size="11">Live Courier GPS Track</text>
    <text x="35" y="112" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="600">Arriving in 8 mins</text>

    <!-- Cart items -->
    <rect x="20" y="205" width="280" height="45" rx="6" fill="#1A2230" />
    <text x="35" y="232" fill="#E9EBEF" font-family="sans-serif" font-size="12">Organic Bowl + Juice</text>
    <text x="250" y="232" fill="#E9EBEF" font-family="sans-serif" font-size="12" font-weight="600">$24.50</text>

    <!-- Checkout button -->
    <rect x="20" y="265" width="280" height="42" rx="6" fill="#4A5FBD" />
    <text x="160" y="291" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Place Order (Apple Pay)</text>
  </g>

  <!-- Central Cloud Realtime Engine -->
  <g transform="translate(360, 100)">
    <rect width="320" height="200" rx="12" fill="#0D1322" stroke="#4A5FBD" stroke-width="2" filter="url(#glow)" stroke-opacity="0.6" />
    <text x="160" y="35" fill="#7E95F7" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">FIRESTORE REAL-TIME STATE</text>
    <rect x="25" y="55" width="270" height="30" rx="4" fill="#171E2C" />
    <text x="35" y="75" fill="#10B981" font-family="monospace" font-size="11">status: "OUT_FOR_DELIVERY"</text>
    <rect x="25" y="95" width="270" height="30" rx="4" fill="#171E2C" />
    <text x="35" y="115" fill="#8A93A3" font-family="monospace" font-size="11">courier_lat: 40.7128, lng: -74.006</text>
    <rect x="25" y="135" width="270" height="35" rx="4" fill="#4A5FBD" fill-opacity="0.15" />
    <text x="160" y="157" fill="#E9EBEF" font-family="sans-serif" font-size="11" text-anchor="middle">Stripe Connect Marketplace Split</text>
  </g>

  <!-- Courier &amp; Merchant App -->
  <g transform="translate(720, 20)">
    <rect width="320" height="360" rx="12" fill="url(#cardGrad)" stroke="#232A36" stroke-width="1.5" />
    <rect x="20" y="20" width="280" height="35" rx="6" fill="#1C2433" />
    <text x="35" y="42" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600">Courier / Driver Interface</text>
    <circle cx="280" cy="37" r="4" fill="#3B82F6" />

    <rect x="20" y="70" width="280" height="100" rx="6" fill="#161D29" />
    <text x="35" y="95" fill="#F59E0B" font-family="sans-serif" font-size="11" font-weight="600">NEW DISPATCH ALERT (15s)</text>
    <text x="35" y="118" fill="#E9EBEF" font-family="sans-serif" font-size="14" font-weight="700">$9.50 • 2.4 miles</text>
    <text x="35" y="140" fill="#8A93A3" font-family="sans-serif" font-size="11">Pickup: Green Kitchen • Drop: 5th Ave</text>

    <rect x="20" y="185" width="135" height="40" rx="6" fill="#232A36" />
    <text x="87" y="210" fill="#8A93A3" font-family="sans-serif" font-size="12" text-anchor="middle">Decline</text>

    <rect x="165" y="185" width="135" height="40" rx="6" fill="#10B981" />
    <text x="232" y="210" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Accept Ride</text>

    <!-- Merchant alert -->
    <rect x="20" y="245" width="280" height="65" rx="6" fill="#1A202C" stroke="#232A36" />
    <text x="35" y="270" fill="#E9EBEF" font-family="sans-serif" font-size="12" font-weight="600">Merchant Tablet: Order #8902</text>
    <text x="35" y="290" fill="#10B981" font-family="sans-serif" font-size="11">Prep Time: 12 mins • Driver Assigned</text>
  </g>
  
  </g>

  <!-- Watermark / Footer branding -->
  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Technical Architecture Series</text>
  </g>
</svg>