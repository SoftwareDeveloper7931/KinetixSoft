      <text x="15" y="118" fill="#10B981" font-family="monospace" font-size="11">   asking_price: numeric</text>
      <text x="15" y="140" fill="#8A93A3" font-family="monospace" font-size="11">   status: 'ACTIVE'|'SOLD'</text>
      <text x="15" y="162" fill="#8A93A3" font-family="monospace" font-size="11">   geohash: string (radius)</text>
    </g>

