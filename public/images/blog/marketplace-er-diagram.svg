      <text x="15" y="21" fill="#7E95F7" font-family="monospace" font-size="13" font-weight="700">listings</text>
      <text x="15" y="52" fill="#E9EBEF" font-family="monospace" font-size="11">🔑 id: uuid [PK]</text>
      <text x="15" y="74" fill="#7E95F7" font-family="monospace" font-size="11">🔗 seller_id: uuid [FK]</text>
