      <text x="15" y="162" fill="#8A93A3" font-family="monospace" font-size="11">   carrier_tracking_num: text</text>
      <text x="15" y="184" fill="#8A93A3" font-family="monospace" font-size="11">   inspection_deadline: time</text>
    </g>

