      <text x="15" y="74" fill="#7E95F7" font-family="monospace" font-size="11">🔗 channel_id: uuid [FK]</text>
      <text x="15" y="96" fill="#7E95F7" font-family="monospace" font-size="11">🔗 sender_id: uuid [FK]</text>
