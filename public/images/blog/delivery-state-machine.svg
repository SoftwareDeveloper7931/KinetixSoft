<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5FBD" />
      <stop offset="100%" stop-color="#364790" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Header Section -->
  <g transform="translate(80, 70)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="65" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">DATABASE LOGIC</text>

    <!-- Title -->
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Order Lifecycle State Machine</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Sub-Second State Transitions via Cloud Firestore & Push Webhooks</text>
  </g>

  <!-- Dynamic Content Area -->
  <g transform="translate(80, 200)">
    
  <g transform="translate(20, 70)">
    <!-- States -->
    <g transform="translate(0, 0)">
      <rect width="160" height="80" rx="8" fill="#161D29" stroke="#374151" stroke-width="1.5" />
      <text x="80" y="38" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">ORDER_PLACED</text>
      <text x="80" y="58" fill="#8A93A3" font-family="sans-serif" font-size="10" text-anchor="middle">Customer Checkout</text>
    </g>

    <path d="M160,40 H220" stroke="#4A5FBD" stroke-width="2" marker-end="url(#arrow)" />

    <g transform="translate(230, 0)">
      <rect width="160" height="80" rx="8" fill="#161D29" stroke="#374151" stroke-width="1.5" />
      <text x="80" y="38" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">ACCEPTED</text>
      <text x="80" y="58" fill="#8A93A3" font-family="sans-serif" font-size="10" text-anchor="middle">Merchant Confirm</text>
    </g>

    <path d="M390,40 H450" stroke="#4A5FBD" stroke-width="2" />

    <g transform="translate(460, 0)">
      <rect width="160" height="80" rx="8" fill="#161D29" stroke="#374151" stroke-width="1.5" />
      <text x="80" y="38" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">PREPARING</text>
      <text x="80" y="58" fill="#8A93A3" font-family="sans-serif" font-size="10" text-anchor="middle">Kitchen Timer</text>
    </g>

    <path d="M620,40 H680" stroke="#4A5FBD" stroke-width="2" />

    <g transform="translate(690, 0)">
      <rect width="160" height="80" rx="8" fill="#161D29" stroke="#4A5FBD" stroke-width="2" />
      <text x="80" y="38" fill="#7E95F7" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">OUT_FOR_DELIVERY</text>
      <text x="80" y="58" fill="#8A93A3" font-family="sans-serif" font-size="10" text-anchor="middle">Live GPS Broadcast</text>
    </g>

    <path d="M850,40 H910" stroke="#10B981" stroke-width="2" />

    <g transform="translate(920, 0)">
      <rect width="140" height="80" rx="8" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-width="1.5" />
      <text x="70" y="38" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">DELIVERED</text>
      <text x="70" y="58" fill="#8A93A3" font-family="sans-serif" font-size="10" text-anchor="middle">Photo Verification</text>
    </g>

    <!-- Bottom info box -->
    <g transform="translate(100, 130)">
      <rect width="860" height="90" rx="8" fill="#111723" stroke="#232A36" />
      <text x="30" y="35" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="600">Automated Push Triggers:</text>
      <text x="30" y="60" fill="#8A93A3" font-family="sans-serif" font-size="12">• Firebase Cloud Messaging triggers localized alerts to driver within 100ms</text>
      <text x="450" y="60" fill="#8A93A3" font-family="sans-serif" font-size="12">• Geofence arrival alert fires when courier enters 100m destination radius</text>
    </g>
  </g>
  
  </g>

  <!-- Watermark / Footer branding -->
  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Technical Architecture Series</text>
  </g>
</svg>