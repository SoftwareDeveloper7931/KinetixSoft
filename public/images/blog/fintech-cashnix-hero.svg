<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0D1322" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5FBD" />
      <stop offset="100%" stop-color="#364790" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2130" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Grid overlay -->
  <g opacity="0.06">
    <path d="M0,75 H1200 M0,150 H1200 M0,225 H1200 M0,300 H1200 M0,375 H1200 M0,450 H1200 M0,525 H1200 M0,600 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M150,0 V675 M300,0 V675 M450,0 V675 M600,0 V675 M750,0 V675 M900,0 V675 M1050,0 V675" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Header Section -->
  <g transform="translate(80, 70)">
    <!-- Badge -->
    <rect x="0" y="0" width="130" height="28" rx="14" fill="#4A5FBD" fill-opacity="0.15" stroke="#4A5FBD" stroke-opacity="0.4" />
    <text x="65" y="18" fill="#7E95F7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="0.5">FINTECH ARCHITECTURE</text>

    <!-- Title -->
    <text x="0" y="65" fill="#E9EBEF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700">Cash Flow Forecasting &amp; Financial Modeling</text>
    <text x="0" y="95" fill="#8A93A3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Forward 30-60-90 Day Cash Curve vs Backward Bookkeeping</text>
  </g>

  <!-- Dynamic Content Area -->
  <g transform="translate(80, 200)">
    
  <g transform="translate(0, 20)">
    <!-- Chart Container -->
    <rect width="640" height="340" rx="12" fill="#101522" stroke="#232A36" stroke-width="1.5" />
    <text x="30" y="40" fill="#E9EBEF" font-family="sans-serif" font-size="16" font-weight="700">Projected Cash Balance (Next 90 Days)</text>
    <text x="30" y="62" fill="#10B981" font-family="sans-serif" font-size="13">+$48,250 net positive projection</text>

    <!-- Axes and Grid -->
    <path d="M40,260 H600" stroke="#232A36" stroke-width="1" />
    <path d="M40,200 H600" stroke="#232A36" stroke-dasharray="3" stroke-width="1" />
    <path d="M40,140 H600" stroke="#232A36" stroke-dasharray="3" stroke-width="1" />
    <text x="40" y="280" fill="#8A93A3" font-family="sans-serif" font-size="11">Today</text>
    <text x="220" y="280" fill="#8A93A3" font-family="sans-serif" font-size="11">+30 Days</text>
    <text x="400" y="280" fill="#8A93A3" font-family="sans-serif" font-size="11">+60 Days</text>
    <text x="560" y="280" fill="#8A93A3" font-family="sans-serif" font-size="11">+90 Days</text>

    <!-- Curve -->
    <path d="M40,220 C120,240 180,160 260,180 C340,200 420,110 500,130 C550,140 580,90 600,100" fill="none" stroke="#4A5FBD" stroke-width="3" />
    
    <!-- Critical alert pin -->
    <circle cx="260" cy="180" r="6" fill="#F59E0B" />
    <rect x="210" y="125" width="100" height="35" rx="4" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" />
    <text x="260" y="142" fill="#F59E0B" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">TAX BILL DIP</text>
    <text x="260" y="154" fill="#E9EBEF" font-family="sans-serif" font-size="9" text-anchor="middle">-$12,400</text>

    <!-- Security &amp; Sync Specs -->
    <g transform="translate(680, 0)">
      <rect width="360" height="100" rx="8" fill="#131926" stroke="#232A36" />
      <text x="25" y="32" fill="#7E95F7" font-family="sans-serif" font-size="13" font-weight="700">Bank-Grade Open Banking</text>
      <text x="25" y="55" fill="#8A93A3" font-family="sans-serif" font-size="11">Plaid / Teller / Mono proxy synchronization ensures sensitive credentials never touch client database.</text>

      <rect y="120" width="360" height="100" rx="8" fill="#131926" stroke="#232A36" />
      <text x="25" y="152" fill="#10B981" font-family="sans-serif" font-size="13" font-weight="700">Cloud Functions Math Engine</text>
      <text x="25" y="175" fill="#8A93A3" font-family="sans-serif" font-size="11">Balances, scenario forecasts, and amortization formulas compute server-side to prevent tampering.</text>

      <rect y="240" width="360" height="100" rx="8" fill="#131926" stroke="#232A36" />
      <text x="25" y="272" fill="#E9EBEF" font-family="sans-serif" font-size="13" font-weight="700">Multi-Tenant Zero-Trust Rules</text>
      <text x="25" y="295" fill="#8A93A3" font-family="sans-serif" font-size="11">Strict Firebase Security Rules enforce cryptographic user-isolation: request.auth.uid == resource.data.userId</text>
    </g>
  </g>
  
  </g>

  <!-- Watermark / Footer branding -->
  <g transform="translate(80, 620)">
    <circle cx="8" cy="-5" r="5" fill="#4A5FBD" />
    <text x="22" y="-1" fill="#4A5FBD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">KinetixSoft</text>
    <text x="100" y="-1" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">• Technical Architecture Series</text>
  </g>
</svg>